<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>레이븐볼트 미니</title></head><body translate="no"><main id="mini" data-size="m" data-status="warn">
<header id="bar">
<span id="dot" class="dot" role="img" aria-label="확인 중"></span>
<button id="headline" class="headline" type="button">…</button>
<div class="tools">
<button id="mask" type="button" aria-pressed="true" aria-label="금액 보이기"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12z"/><circle cx="12" cy="12" r="3"/><path class="slash" d="M4 4l16 16"/></svg></button>
<button id="size" type="button" aria-label="크기 바꾸기"><span id="size-label">M</span></button>
<button id="open-main" type="button" aria-label="큰 화면 열기"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4h6v6M20 4l-9 9M18 14v6H4V6h6"/></svg></button>
<button id="close" type="button" aria-label="닫기"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
</div>
</header>
<button id="notice" class="notice" type="button" hidden><strong id="notice-title"></strong> <span id="notice-body"></span></button>
<p id="pending" class="pending" hidden></p>
<ul id="recent" class="recent"></ul>
<p id="node" class="node"></p>
<section id="extra" class="extra">
<p id="lockline" class="line"></p>
<p id="awake" class="line"></p>
<section id="seller" class="seller" hidden><h2 id="seller-title">오늘</h2><p id="sales" class="line"></p><p id="deps" class="line"></p></section>
<div class="opts">
<label><input id="opt-top" type="checkbox"> <span id="opt-top-label">항상 위에</span></label>
<label><input id="opt-sound" type="checkbox"> <span id="opt-sound-label">소리</span></label>
<label><input id="opt-notify" type="checkbox"> <span id="opt-notify-label">알림</span></label>
</div>
<p id="readonly" class="readonly"></p>
</section>
</main><script type="module" src="/src/mini-main.ts"></script></body></html>
