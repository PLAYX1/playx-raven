# 맥·윈도우·리눅스 설치 파일을 만들어 공개 저장소에 올린다.
#
# 🔴 왜 깃허브에서 만드나 — **한 대의 컴퓨터로는 셋을 못 만든다.**
# 리눅스 빌드에는 `webkit2gtk` 가 필요한데 그건 리눅스에만 있고, 윈도우
# 빌드에는 WebView2 와 MSVC 링커가 필요한데 그건 윈도우에만 있다. 실측으로
# 확인했다(맥에 webkit2gtk 없음). 그래서 세 기계가 각각 자기 것을 만든다.
#
# ## 어디에 올리나
#
# `PLAYX1/playx-raven-releases` — **파일만 담는 공개 저장소**다.
# 소스가 있는 `playx-raven` 은 비공개로 남는다.
#
# 왜 나눴나:
#   - 비공개 저장소의 릴리스 파일은 **로그인 없이는 안 열린다.** 사장에게
#     깃허브 계정을 만들라고 할 수는 없다.
#   - `playx` 본체에 넣으면 판올림마다 30MB 씩 저장소가 커지고, 한 번 커지면
#     못 줄인다(지금 이미 .git 이 721MB).
#
# 사장은 깃허브 화면을 볼 일이 없다 — rvn.ex.erci.se 의 단추가 파일을 바로
# 받는다. 깃허브 화면은 "어느 파일을 눌러야 하지" 로 사람을 잃는 자리다.
#
# ## 왜 PAT(개인 토큰) 를 안 쓰나
#
# 깃허브는 **토큰을 API 로 만들 수 없다**(`POST /user/tokens` → 404). 사람이
# 브라우저에서 만들어야 하고, 그건 자동화가 끊기는 자리다.
#
# 대신 **배포키(SSH)** 를 쓴다. gh 로 넣을 수 있고, 무엇보다 **범위가 저장소
# 하나**다. 개인 토큰은 그 사람의 모든 저장소에 닿지만 이 열쇠는
# `playx-raven-releases` 에만 닿는다 — 그리고 거기엔 설치 파일밖에 없다.
#
# 그래서 릴리스 API 대신 **git push** 로 올린다. 배포키는 git 만 되고 API 는
# 안 된다. 파일은 `raw.githubusercontent.com` 이 그대로 내어 준다.
#
# ⚠️ 판올림마다 `dist` 가지를 **뿌리째 새로 만든다**(orphan). 옛 판을 쌓아
# 두면 저장소가 판올림마다 40MB 씩 커지고 되돌릴 수 없다. 사람은 늘 최신을
# 받고, 자동 판올림도 우리 서버가 알려주는 최신 주소를 쓴다.
#
# ## ⚠️ 서명
#
# 자동 판올림은 `TAURI_SIGNING_PRIVATE_KEY` 로 서명된 것만 설치한다.
# 그 열쇠는 **이 저장소에 없다**(`~/.playx-raven/updater.key`). 저장소 비밀로
# 넣어 둔다. 새면 남이 가짜 판올림을 밀어넣을 수 있다.
name: 설치 파일 만들기

# 🔴 판올림 둘이 겹치면 `dist` 를 서로 덮어쓰다 터진다. 실측:
#    「cannot lock ref 'refs/heads/dist': is at … but expected …」
#    0.1.6 과 0.1.7 이 겹쳐서 0.1.7 의 올리기가 통째로 실패했다.
#    앞엣것을 죽이지는 않는다 — 만들던 것은 끝까지 만들고 줄을 선다.
concurrency:
  group: release
  cancel-in-progress: false

on:
  push:
    tags: ["v*"]
  # 손으로도 돌릴 수 있어야 한다. 태그를 잘못 달았을 때 다시 만들 길이 없으면
  # 태그를 지우고 다시 다는 수밖에 없고, 그건 이미 받은 사람을 헷갈리게 한다.
  workflow_dispatch:
    inputs:
      version:
        description: "판 번호 (예: 0.1.1)"
        required: true

permissions:
  contents: read

jobs:
  build:
    strategy:
      # 🔴 한 기계가 실패해도 나머지는 끝까지 만든다. 기본값은 하나가 죽으면
      # 전부 취소인데, 그러면 윈도우 하나 때문에 맥·리눅스까지 못 받는다.
      fail-fast: false
      matrix:
        include:
          # 2026-08-22 이 저장소가 **공개**가 되면서 분(分) 계산이 사라졌다.
          # 공개 저장소는 깃허브 호스팅 러너가 무제한 무료다 — 맥이 10배로
          # 깎이던 것도 이제 셈할 이유가 없다.
          #
          # 그래서 넷을 다 여기서 만든다. 손으로 올리는 단계가 없어졌고,
          # 그 단계가 없어졌다는 건 **"맥만 옛 판" 사고가 구조적으로 불가능**
          # 해졌다는 뜻이다. 잊을 수 있는 일은 언젠가 잊는다.
          - os: macos-14          # 애플 실리콘 (M1 이상)
            target: aarch64-apple-darwin
            label: mac-apple-silicon
          # 🔴 macos-13(인텔)·ubuntu-22.04 는 깃허브가 은퇴시키는 중이다.
          # 은퇴한 라벨을 적으면 실패가 아니라 **영원히 큐에 남는다** —
          # 실측: 이 넷이 10시간 대기, 같은 저장소의 ubuntu-latest 작업은
          # 20초에 잡혔다. 오류가 안 나서 원인을 찾기가 특히 어렵다.
          #
          # 인텔 맥은 잠시 뺀다. 라벨을 확인한 뒤 다시 넣는다 —
          # 없는 것보다 안 뜨는 것이 낫고, 지금은 맥 사장이 못 받는다.
          - os: macos-latest      # 애플 실리콘 (인텔은 라벨 확인 후 다시)
            target: x86_64-apple-darwin
            label: mac-intel
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows
          # ⚠️ 옛 리눅스 호환을 위해 22.04 로 고정했었는데, 그 라벨이
          # 은퇴 중이라 잡히지를 않는다. 도는 것이 먼저다.
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            label: linux

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # 리눅스만 재료를 따로 깐다. 나머지 둘은 OS 에 이미 있다.
      - name: 리눅스 재료
        # 🔴 여기가 `ubuntu-22.04` 로 남아 있어서 **이 단계가 통째로 건너뛰어졌다.**
        # 러너 라벨을 -latest 로 바꾸면서 이 조건을 안 고쳤다. 재료를 아무리
        # 늘려도 소용이 없었던 진짜 이유다 — 두 번을 엉뚱한 데서 헤맸다.
        #
        # 라벨을 다시 적지 않고 **라벨이 무엇이든** 리눅스면 돌게 한다.
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          # 🔴 webkit2gtk 만으로는 모자란다. 실측 실패: pangocairo·pango·
          # harfbuzz 를 못 찾아 링크가 죽었다. ubuntu-latest(24.04)가
          # 22.04 보다 기본 설치가 적어서, 22.04 에서는 안 나던 오류다.
          # 🔴 두 번 실패하며 하나씩 늘려 봤는데, 그러다 보면 계속 하나씩
          # 모자란다. Tauri 가 공식으로 적어 둔 목록을 통째로 쓴다.
          #
          # ⚠️ `-y` 만으로는 부족했다. 실패해도 계속 가서 링크 단계에서야
          #    드러났다 — `set -e` 로 여기서 멈추게 한다.
          set -e
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential curl wget file \
            libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf
          # 위가 Tauri v2 공식 목록이다. gtk·pango·cairo·atk 는 webkit2gtk 가
          # 의존으로 끌어오므로 따로 적지 않는다 — 적으면 이름이 판마다 달라
          # 오히려 깨진다(ubuntu-24.04 에서 libgdk-pixbuf-2.0-dev 가 그랬다).
          pkg-config --exists gtk+-3.0 && echo "  gtk 있음" || { echo "🔴 gtk 없음"; exit 1; }

      - uses: dtolnay/rust-toolchain@stable
        with:
          # 애플 실리콘 러너에서 인텔용도 만든다. macOS 는 두 대상을 다 지원한다.
          targets: ${{ matrix.target }}

      # 빌드가 10분 넘게 걸린다. 매번 처음부터 하면 판올림 한 번에 40분이다.
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      # ── 레이븐 노드를 같이 넣는다 ─────────────────────────────────
      #
      # 🔴 사장님께 「먼저 레이븐 코어를 받아 설치하세요」라고 말하는 순간
      #    문이 닫힌다. 70대 사장이 그걸 하지 않는다. 실제로 그 벽에 걸렸다.
      #
      #    실행 중에 내려받는 것과는 다르다. 그건 계속 안 한다 — 무엇을
      #    받았는지 증명할 수 없다. 여기서 받는 것은 **체크섬을 대조**하고,
      #    우리가 서명한 설치 파일 **안에** 들어간다.
      #
      # 🔴 애플 실리콘 맥은 공식 배포가 없다(win64·linux·osx64[인텔]뿐).
      #    그래서 맥에서는 이 단계가 그냥 넘어가고, 앱은 사장이 따로 깔아 둔
      #    것을 찾아 쓴다. 우리가 빌드해 올리면 그때 여기에 더한다.
      - name: 레이븐 노드 넣기
        shell: bash
        run: |
          set -euo pipefail
          B=https://github.com/RavenProject/Ravencoin/releases/download/v4.8.0
          P=raven-4.8.0-225491298
          mkdir -p src-tauri/vendor
          case "${{ matrix.target }}" in
            x86_64-pc-windows-msvc)
              F=$P-win64.zip
              # 2026-08-26 에 손으로 받아 대조한 값이다. 이 값이 안 맞으면
              # 받은 것이 우리가 확인한 그 파일이 아니다 — 멈춘다.
              WANT=7b39dface10966fc92703eacd9e562cd61d9c18f1fcad5dcbc196742e0ff1752
              ;;
            x86_64-unknown-linux-gnu)
              F=$P-x86_64-linux-gnu.tar.gz
              WANT=cb359b6a5b42e47068cd655231484fcc763d2f79eae5ea318b029c704a4dc020
              ;;
            aarch64-apple-darwin)
              # 🔴 공식 v4.8.0 에 애플 실리콘 판이 **없다**(win64·linux·osx64[인텔]뿐).
              #    그래서 우리가 원본 소스에서 직접 빌드해 올려 두었다.
              #
              #    기준: RavenProject/Ravencoin v4.8.0-2-g0894f15de, 소스 수정 없음.
              #    묶인 라이브러리는 맥 기본 둘뿐(libSystem, libc++) — 홈브루도
              #    boost 도 안 물려 있어 **어느 맥에서나 돈다.** 깨끗한 폴더에서
              #    기동까지 확인했다.
              B=https://github.com/PLAYX1/playx-raven-releases/releases/download/vendor-ravend-4.8.0
              F=ravend-macos-arm64
              WANT=d008e5ed56497dc394ce32e95f61a5e5b19fb59a0cbb5b6600c7aa3bc69a4806
              ;;
            *)
              echo "이 기계에는 넣을 노드가 없습니다. 넘어갑니다: ${{ matrix.target }}"
              exit 0
              ;;
          esac
          curl -fsSL "$B/$F" -o node.pkg
          # 🔴 맥에는 `sha256sum` 이 없다. `shasum` 뿐이다. 이 줄 때문에
          #    애플 실리콘 빌드가 통째로 실패했다(exit 127). 맥이 이 줄에
          #    닿게 된 것은 우리 빌드를 넣으면서부터다 — 그전에는 위에서
          #    빠져나갔다. 두 이름을 다 본다.
          if command -v sha256sum >/dev/null; then
            GOT=$(sha256sum node.pkg | cut -d" " -f1)
          else
            GOT=$(shasum -a 256 node.pkg | cut -d" " -f1)
          fi
          if [ "$GOT" != "$WANT" ]; then
            echo "🔴 체크섬이 다릅니다. 받은 것: $GOT / 적힌 것: $WANT"
            exit 1
          fi
          mkdir -p nodetmp
          case "$F" in
            *.zip)    unzip -q node.pkg -d nodetmp ;;
            *.tar.gz) tar -xzf node.pkg -C nodetmp ;;
            # 우리가 올린 맥 것은 실행 파일 그대로다. 풀 것이 없다.
            *)        cp node.pkg nodetmp/ravend ;;
          esac
          # `ravend` 하나만 꺼낸다. 지갑 창(raven-qt)은 안 넣는다 — 우리 앱이
          # 그 일을 하고, 40MB 를 더 받게 할 이유가 없다.
          BIN=$(find nodetmp -type f \( -name ravend -o -name ravend.exe \) | head -1)
          if [ -z "$BIN" ]; then
            echo "🔴 받은 꾸러미 안에 ravend 가 없습니다."
            exit 1
          fi
          cp "$BIN" "src-tauri/vendor/$(basename "$BIN")"
          chmod +x "src-tauri/vendor/$(basename "$BIN")" || true
          ls -la src-tauri/vendor/
          # 🔴 파일이 정말 있을 때만 `resources` 를 켠다. 글로브가 아무것도
          #    못 찾으면 Tauri 빌드가 통째로 멈춘다(실측).
          node -e "
            const fs=require('fs'), p='src-tauri/tauri.conf.json';
            const d=JSON.parse(fs.readFileSync(p,'utf8'));
            d.bundle.resources=['vendor/ravend*'];
            fs.writeFileSync(p, JSON.stringify(d,null,2)+'\n');
            console.log('resources 켬');
          "

      - name: 만들기
        env:
          # 자동 판올림이 검사할 서명. 없으면 만들어지긴 하는데 판올림이 안 된다.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build --target ${{ matrix.target }}

      - name: 만든 것 모으기
        shell: bash
        run: |
          mkdir -p out
          # 이름을 사람이 읽을 수 있게 바꾼다. 사장이 받은 파일을 보고
          # "이게 내 컴퓨터 것이 맞나" 를 알 수 있어야 한다.
          # 🔴 `GITHUB_REF_NAME` 은 태그로 돌 때만 판 번호다. 손으로 돌리면
          # 가지 이름(`main`)이 들어가서 파일이 `…-main-windows.msi` 가 됐다.
          # 사장이 받은 파일이 몇 판인지 알 수 없다.
          V="${{ inputs.version }}"
          [ -z "$V" ] && V="${GITHUB_REF_NAME#v}"
          [ -z "$V" ] || [ "$V" = "main" ] && V="0.0.0-dev"
          B="src-tauri/target/${{ matrix.target }}/release/bundle"
          find "$B" -maxdepth 2 -type f \
            \( -name '*.dmg' -o -name '*.msi' -o -name '*.exe' -o -name '*.AppImage' -o -name '*.deb' \) \
            -print0 | while IFS= read -r -d '' f; do
              ext="${f##*.}"
              cp "$f" "out/PLAY-X-Raven-${V}-${{ matrix.label }}.${ext}"
            done

          # 🔴 판올림 서명(`.sig`)도 같이 챙긴다.
          #
          #    여태 서명 열쇠는 저장소 비밀에 멀쩡히 있었는데
          #    `createUpdaterArtifacts` 가 꺼져 있어 **서명이 아예 안 만들어졌다.**
          #    그래서 자동 판올림이 켜져 있는데도 아무도 새 판을 못 받았다 —
          #    0.1.2 를 쓰는 사람에게 서버가 「최신입니다」라고 답했다.
          #
          #    서명이 없으면 Tauri 는 받은 것을 **설치하지 않는다.** 그게 맞다.
          #    없으면 아무나 가짜 판올림을 밀어 넣는다.
          find "$B" -maxdepth 3 -type f -name '*.sig' -print0 | while IFS= read -r -d '' f; do
            base="${f%.sig}"
            ext="${base##*.}"
            # `.tar.gz.sig` 처럼 두 겹인 것은 앞엣것까지 살린다.
            case "$base" in *.tar.gz) ext="tar.gz" ;; esac
            cp "$f" "out/PLAY-X-Raven-${V}-${{ matrix.label }}.${ext}.sig"
            # 맥 판올림은 `.app.tar.gz` 를 받는다. dmg 로는 못 고친다.
            [ -f "$base" ] && cp "$base" "out/PLAY-X-Raven-${V}-${{ matrix.label }}.${ext}"
          done
          ls -la out/
          # 판올림용 묶음과 서명은 이름을 그대로 둔다 — 업데이터가 이 이름을 본다.
          find "$B" -type f \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.sig' \) \
            -exec cp {} out/ \; 2>/dev/null || true
          ls -la out/

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.label }}
          path: out/*

  publish:
    needs: build
    # 🔴 하나가 실패해도 나머지는 올린다. 넷을 다 기다리면 윈도우 하나 때문에
    # 맥 사장이 못 받는다. 무엇이 빠졌는지는 릴리스 설명에 적는다.
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4   # 이 저장소가 아니라 열쇠 준비용 셸만 쓴다
        with: { fetch-depth: 0 }

      - uses: actions/download-artifact@v4
        with:
          path: all

      - name: 한 곳에 모으고 해시 적기
        run: |
          mkdir -p rel && find all -type f -exec cp {} rel/ \;
          cd rel && sha256sum * > SHA256SUMS.txt || true
          ls -la

      - name: 열쇠 준비
        env:
          # ⚠️ 이 열쇠는 `playx-raven-releases` **한 곳에만** 닿는다. 소스
          # 저장소에는 못 쓴다 — 새더라도 소스가 같이 새지 않게.
          KEY: ${{ secrets.RELEASES_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # 처음 보는 서버라고 물어보면 거기서 멈춘다. 깃허브 지문을 미리 넣는다.
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null

      - name: 공개 저장소에 올리기
        run: |
          V="${{ inputs.version }}"
          [ -z "$V" ] && V="${GITHUB_REF_NAME#v}"
          [ -z "$V" ] || [ "$V" = "main" ] && V="0.0.0-dev"
          git config --global user.name playx1
          git config --global user.email playexercise@gmail.com
          git clone --depth 1 git@github.com:PLAYX1/playx-raven-releases.git pub
          cd pub
          # 🔴 뿌리째 새로 만든다. 옛 판을 쌓으면 판올림마다 40MB 씩 커지고
          #    되돌릴 수 없다. 사람은 늘 최신을 받는다.
          git checkout --orphan dist
          git rm -rf . >/dev/null 2>&1 || true
          rm -rf ./* .gitignore 2>/dev/null || true
          cp ../rel/* .

          # 🔴 판 번호가 안 붙은 이름도 **같이** 올린다.
          #
          #    `dist` 는 판올림마다 뿌리째 새로 만든다. 그래서 v0.1.3 을 올린
          #    순간 0.1.2 파일이 전부 사라졌는데, 랜딩(`public/rvn/index.html`)
          #    은 그대로 0.1.2 를 가리키고 있었다 — 맥·인텔맥·윈도우·리눅스
          #    **네 개 전부 404**. 사이트에 온 사람은 아무것도 못 받았다.
          #
          #    판마다 남의 저장소 파일 여덟 자리를 손으로 고치는 방식은
          #    언젠가 또 빠뜨린다. 안 바뀌는 이름을 하나 두고 그걸 가리키게
          #    한다. 판 번호가 붙은 이름도 그대로 남는다 — 특정 판을 콕
          #    집어 받아야 할 때가 있다.
          for f in PLAY-X-Raven-*; do
            case "$f" in
              *.md) continue ;;
            esac
            latest=$(echo "$f" | sed "s/PLAY-X-Raven-[0-9][0-9.]*-/PLAY-X-Raven-latest-/")
            [ "$latest" = "$f" ] || cp "$f" "$latest"
          done
          # 무엇이 최신인지 기계도 읽을 수 있게 적어 둔다.
          printf '%s\n' "$V" > VERSION

          # 🔴 자동 판올림이 읽을 표. 서명이 있는 것만 담는다 — 서명 없는
          #    줄을 담으면 앱이 받아 놓고 설치를 거부한다(더 나쁘다).
          node -e "
            const fs=require('fs');
            const V=process.argv[1];
            const R='https://raw.githubusercontent.com/PLAYX1/playx-raven-releases/dist';
            const map={
              'windows-x86_64': ['windows.exe'],
              'darwin-aarch64': ['mac-apple-silicon.app.tar.gz'],
              'darwin-x86_64':  ['mac-intel.app.tar.gz'],
              'linux-x86_64':   ['linux.AppImage'],
            };
            const platforms={};
            for (const [k, names] of Object.entries(map)) {
              for (const n of names) {
                const f = \`PLAY-X-Raven-\${V}-\${n}\`;
                if (fs.existsSync(f) && fs.existsSync(f+'.sig')) {
                  platforms[k] = {
                    signature: fs.readFileSync(f+'.sig','utf8').trim(),
                    url: \`\${R}/\${f}\`,
                  };
                }
              }
            }
            const out={
              version: V,
              notes: '새 판이 나왔습니다.',
              pub_date: new Date().toISOString(),
              platforms,
            };
            fs.writeFileSync('latest.json', JSON.stringify(out,null,2));
            console.log('latest.json 에 담긴 기계:', Object.keys(platforms).join(', ') || '없음');
          " "$V"
          cat > README.md <<EOF
          # PLAY X Raven $V

          가게 컴퓨터용 **설치 파일만** 있습니다. 소스는 여기 없습니다.

          받으시는 곳: <https://rvn.ex.erci.se>

          받은 파일이 맞는지 확인하시려면 \`SHA256SUMS.txt\` 의 값과
          비교하세요. 다르면 받다가 깨졌거나 누가 바꾼 것이니 **열지 마세요.**
          EOF
          git add -A
          git commit -q -m "PLAY X Raven $V"
          # 줄을 세워 두었어도, 손으로 돌린 것과 겹칠 수 있다. 한 번 더 해 본다 —
          # 여기서 실패하면 만든 설치 파일이 아무 데도 안 올라간다.
          if ! git push -f origin dist; then
            echo "한 번 실패했습니다. 다시 받아서 한 번 더 합니다."
            sleep 10
            git fetch origin dist || true
            git push -f origin dist
          fi
