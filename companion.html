<!doctype html><html lang="ko" data-ravi-arriving="true"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>레이븐볼트 · 라비</title></head><body><main id="companion"><button id="bird" aria-label="라비에게 말하기. 끌어서 이동, 두 번 누르면 큰 화면" title="끌어서 이동 · 두 번 눌러 큰 화면"><span id="character"></span><span id="sparkles" aria-hidden="true"></span></button><section id="bubble" hidden aria-label="라비 말풍선"><header><strong>라비</strong><button id="settings-toggle" aria-label="라비 설정">⚙</button><button id="collapse" aria-label="말풍선 접기">×</button></header><p id="status" role="status">곁에 있을게요.</p><div id="answer" aria-live="polite"></div><div id="ravi-voice-surface" translate="no" hidden>
          <p id="ravi-voice-note" role="status" aria-live="polite"></p>
          <canvas id="ravi-voice-wave" width="240" height="36" aria-hidden="true" hidden></canvas><span id="ravi-voice-time" hidden></span>
          <div id="ravi-voice-consent" hidden><strong id="ravi-voice-provider"></strong><p id="ravi-voice-disclosure"></p><button id="ravi-voice-agree" type="button"></button><button id="ravi-voice-decline" type="button"></button></div>
          <button id="ravi-mic-settings" type="button" hidden></button>
        </div>
<form id="ask"><label for="question">라비에게 물어보기</label><div class="input-row"><input id="question" maxlength="1000" autocomplete="off" placeholder="무엇을 도와드릴까요?"><button id="rv-voice" type="button" aria-label="말로 묻기" aria-pressed="false">🎙</button><button type="submit">물어보기</button></div></form><button id="open-main">큰 화면에서 계속하기</button><details id="preferences"><summary>라비 설정</summary><div translate="no"><button id="ravi-voice-revoke" type="button"></button><p id="ravi-voice-revoked" role="status"></p></div><label>크기 <select id="size"><option value="120">작게</option><option value="160">보통</option><option value="200">크게</option></select></label><label><input type="checkbox" id="greeting">시작 인사</label><label><input type="checkbox" id="sound">작은 효과음</label><label><input type="checkbox" id="reduced">동작 줄이기</label><label><input type="checkbox" id="battery">전력 절약 (최대 24fps)</label><label><input type="checkbox" id="resident_start">다음 시작은 라비만</label><label><input type="checkbox" id="simple_window">일반 작은 창 (다시 시작 시 배경 적용)</label><label>단축키 후보 <select id="shortcut"><option>Alt+Space</option><option>Alt+Shift+Space</option><option>Control+Shift+Space</option></select></label><p id="shortcut-notice"></p><p id="platform-notice"></p><button id="save" type="button">설정 저장</button></details></section></main><script type="module" src="/src/ravi-companion.ts"></script></body></html>
