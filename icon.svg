<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!--
    PLAY X Raven — 카운터 위에 켜 두는 기계의 표시.

    새를 그리지 않는다. Ravencoin 공식 마크를 흉내 내는 순간 공식 지갑인 척
    하게 되고, 이건 별개의 제품이다. 부리·눈·깃 실루엣도 같은 이유로 없다.

    형태는 같은 두께의 막대 셋뿐이다: X 두 개와 그 발이 올라선 받침 하나.
    32px Dock에서 사라질 세부를 처음부터 넣지 않았다 — 고리, 점, 눈, 두 번째
    기호는 그 크기에서 1~2px 잡티가 된다.

    각도 35°는 고정값이다. 더 세우면 32px에서 X가 흰 기둥으로 뭉개진다.
    색은 #384192가 아니라 #5874cf — 어두운 남색은 Dock 크기에서 진창이 된다.

    타일은 1024 캔버스 안에 824로 앉힌다. macOS는 아이콘이 이 여백을 지킬
    것을 전제로 Dock 간격을 잡기 때문에, 꽉 채우면 옆 앱보다 커 보인다.
    모서리 반경은 타일 폭의 22.5% — 애플의 스쿼클에 가장 가까운 원호 근사다.
  -->
  <g transform="translate(100,100)">
    <rect width="824" height="824" rx="185" ry="185" fill="#5874cf"/>

    <!-- 아래 좌표는 824 타일 기준. 두께 T = 77.5 (타일의 9.4%). -->
    <g fill="#F2F3F8">
      <!-- X. 교차점 (412, 367). 끝은 직각으로 자른다 — 둥근 끝은 작은
           크기에서 두께를 잃는다. -->
      <path d="M 264.4 222.8 L 319.3 167.9 L 559.6 511.2 L 504.7 566.1 Z"/>
      <path d="M 504.7 167.9 L 559.6 222.8 L 319.3 566.1 L 264.4 511.2 Z"/>

      <!-- 받침. X 두 발이 조금 겹치도록 올려, 발이 보 양 끝에 앉는다.
           틈이 있으면 두 개의 물건이 되고, 겹치면 한 글자로 읽힌다. -->
      <rect x="234.8" y="563.7" width="354.3" height="77.5"/>
    </g>
  </g>
</svg>
