<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- 🔴 이 화면은 지갑과 **같은 출처**다(가게IP:8790). 여기서 남의
         스크립트가 한 줄이라도 돌면 localStorage 의 12단어를 읽을 수
         있다. 지갑만 막아 둔 것은 반쪽이었다.

         `script-src 'self'` 는 인라인 <script> 를 막는다. 이 화면들은
         본문에 <script> 를 쓰므로 그 해시를 넣는 대신 `unsafe-inline` 을
         쓰되, **가져오는 곳은 자기 자신뿐**으로 못 박는다 — 남이 넣은
         글자가 스크립트로 실행돼도 결과를 밖으로 보낼 길이 없다. -->
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'none'; script-src 'self' 'unsafe-inline';
                   style-src 'unsafe-inline'; img-src 'self' data: http: https:;
                   connect-src 'self'; base-uri 'none'; form-action 'none';
                   frame-ancestors 'none'" />
    <title>검표</title>
    <style>
      /* 문 앞 태블릿. 팔 길이에서 한 번에 읽혀야 하고, 하루 종일 켜져 있다. */
      :root {
        --bg: #ffffff; --fg: #141518; --muted: #4b5568; --line: #dde3f0;
        --ok: #1c7a45; --no: #b32b22; --panel: #f7f8fb; --ravi: #e7731f; --ravi-soft: #8375ae; --ravi-tint: #fdf1e7;
        --safe-b: env(safe-area-inset-bottom, 0px);
      }
      @media (prefers-color-scheme: dark) {
        :root { --bg: #0d0f13; --fg: #eceef2; --muted: #b3bdd6; --line: #2a2f3a;
                --ok: #4fbe83; --no: #e8776c; --panel: #171a21; } --ravi: #f0913f; --ravi-soft: #a294cb; --ravi-tint: #2a1f18;
      }
      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      body { margin: 0; background: var(--bg); color: var(--fg);
             font: 17px/1.6 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif;
             padding: 22px 20px calc(24px + var(--safe-b)); }
      h1 { margin: 0 0 4px; font-size: 19px; }
      .sub { color: var(--muted); font-size: 14px; }

      input { width: 100%; padding: 20px 16px; margin-top: 16px; border-radius: 13px;
              border: 2px solid var(--line); background: var(--bg); color: var(--fg);
              font-size: 22px; font-family: inherit; }
      input:focus { outline: none; border-color: var(--fg); }

      /* 판정은 한 화면을 덮는다. 곁눈질로 읽혀야 한다. */
      .verdict { margin-top: 20px; border-radius: 16px; padding: 24px 24px; text-align: center;
                 display: none; }
      .verdict.on { display: block; }
      .verdict.yes { background: color-mix(in srgb, var(--ok) 14%, transparent);
                     border: 2px solid var(--ok); }
      .verdict.no { background: color-mix(in srgb, var(--no) 12%, transparent);
                    border: 2px solid var(--no); }
      .big { font-size: 40px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.2; }
      .verdict.yes .big { color: var(--ok); }
      .verdict.no .big { color: var(--no); }
      .who { font-size: 24px; font-weight: 600; margin-top: 8px; }
      .detail { color: var(--muted); font-size: 16px; margin-top: 4px; }

      button { margin-top: 16px; width: 100%; padding: 20px; border-radius: 13px; border: 0;
               background: var(--ok); color: #fff; font-size: 20px; font-weight: 600;
               font-family: inherit; cursor: pointer; }
      button.ghost { background: transparent; color: var(--fg); border: 1px solid var(--line);
                     font-weight: 400; font-size: 16px; padding: 12px; }
      .note { margin-top: 24px; font-size: 13.5px; color: var(--muted); line-height: 1.75; }
    
      /* ── 손맛 ────────────────────────────────────────────────────────────
         "즐거운 인터랙션" 은 화려한 애니메이션이 아니라 **누른 것이 눌린 것처럼
         반응하는 것**이다. 아이폰이 처음에 준 느낌이 그거였다.
         전부 CSS 로만 한다 — 이 화면들의 조건은 외부 스크립트 0개다. */

      /* 누르면 실제로 들어간다. 60~90ms 는 "반응이 즉시"로 느껴지는 구간이고,
         이보다 길면 굼떠 보이고 짧으면 안 보인다. */
      button, .btn, a.btn {
        transition: transform .08s ease, box-shadow .16s ease, background .16s ease,
                    border-color .16s ease;
      }
      button:active, .btn:active { transform: scale(.965); }

      /* 손가락이 닿기 전에 먼저 반응한다(마우스가 있는 기기에서만). */
      @media (hover: hover) {
        button:hover:not(:disabled) { border-color: var(--ravi); }
      }

      /* 눌렀을 때 그 자리에서 번지는 빛. ::after 하나로 끝난다. */
      button { position: relative; overflow: hidden; }
      button::after {
        content: ""; position: absolute; inset: 0; border-radius: inherit;
        background: radial-gradient(circle at center, var(--ravi) 0%, transparent 62%);
        opacity: 0; transform: scale(.2); pointer-events: none;
      }
      button:active::after { animation: tap .42s ease-out; }
      @keyframes tap {
        0%   { opacity: .30; transform: scale(.2); }
        100% { opacity: 0;   transform: scale(1.7); }
      }

      /* 값이 바뀐 자리를 눈이 따라가게. 숫자가 조용히 갈리면 못 본다. */
      .pop { animation: pop .34s cubic-bezier(.34,1.56,.64,1); }
      @keyframes pop {
        0% { transform: scale(1); } 45% { transform: scale(1.14); } 100% { transform: scale(1); }
      }

      /* 기다리는 자리. 회색 상자가 가만히 있으면 고장으로 읽힌다. */
      .shimmer { background: linear-gradient(90deg,
        var(--panel) 25%, var(--line) 37%, var(--panel) 63%);
        background-size: 400% 100%; animation: shim 1.4s linear infinite; }
      @keyframes shim { 0% { background-position: 100% 0; } 100% { background-position: 0 0; } }

      /* 새로 들어온 줄은 아래에서 올라온다. 튀어나오면 놀라고, 스며들면 놓친다. */
      .risein { animation: risein .28s ease-out both; }
      @keyframes risein {
        from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; }
      }

      /* 움직임을 줄이는 설정을 켠 사람에게는 전부 멈춘다. 멀미는 취향이 아니다. */
      @media (prefers-reduced-motion: reduce) {
        button, .btn, a.btn { transition: none; }
        button:active, .btn:active { transform: none; }
        button:active::after, .pop, .shimmer, .risein { animation: none; }
      }
</style>
  </head>
  <body>
    <h1>검표</h1>
    <div class="sub">회원 이름·전화 뒷자리·회원번호를 넣으세요</div>

    <input id="q" placeholder="홍길동 · 5678 · A7K2" autocomplete="off" autofocus />

    <div class="verdict" id="v">
      <div class="big" id="v-big"></div>
      <div class="who" id="v-who"></div>
      <div class="detail" id="v-detail"></div>
      <button id="v-in" style="display:none">입장 처리</button>
      <button class="ghost" id="v-next">다음 사람</button>
    </div>

    <p class="note">
      이 화면은 <b>확인만</b> 합니다. 주문도, 회원 명단도, 지갑도 볼 수 없습니다.<br />
      문 앞에 놓고 하루 종일 켜 두는 화면이라 그렇게 만들었습니다.
    </p>

    <script>
      const $ = (id) => document.getElementById(id);
      const q = new URLSearchParams(location.search).get("t");
      const token = q || sessionStorage.getItem("st") || "";
      if (q) {
        sessionStorage.setItem("st", token);
        // 주소창에 열쇠를 남기지 않는다. 문 앞 태블릿은 아무나 만진다.
        history.replaceState(null, "", "/scan");
      }
      const H = { "x-playx-token": token, "content-type": "application/json" };

      let current = null, timer;

      $("q").oninput = () => {
        clearTimeout(timer);
        const v = $("q").value.trim();
        if (v.length < 2) { $("v").className = "verdict"; return; }
        timer = setTimeout(check, 250);
      };

      async function check() {
        const query = $("q").value.trim();
        try {
          const r = await fetch("/api/scan/check", {
            method: "POST", headers: H, body: JSON.stringify({ query }),
          }).then((x) => x.json());

          if (!r.found) {
            current = null;
            $("v").className = "verdict no on";
            $("v-big").textContent = "찾지 못함";
            $("v-who").textContent = "";
            $("v-detail").textContent = "이름 일부나 전화 뒷자리로 다시 해보세요";
            $("v-in").style.display = "none";
            return;
          }

          current = r;
          const ok = r.valid;
          $("v").className = `verdict ${ok ? "yes" : "no"} on`;
          $("v-big").textContent = ok ? "들어오세요" : "안 됩니다";
          $("v-who").textContent = r.name || "";
          $("v-detail").textContent = ok
            ? r.kind === "punch" ? `${r.left}회 남음` : ""
            : r.why || "";
          $("v-in").style.display = ok ? "" : "none";
        } catch (e) {
          $("v").className = "verdict no on";
          $("v-big").textContent = "확인 실패";
          $("v-detail").textContent = String(e);
        }
      }

      $("v-in").onclick = async () => {
        if (!current) return;
        try {
          const r = await fetch("/api/scan/in", {
            method: "POST", headers: H, body: JSON.stringify({ asset: current.asset }),
          }).then((x) => x.json());
          if (r.error) throw new Error(r.error);
          $("v-big").textContent = "처리됨";
          $("v-detail").textContent =
            current.kind === "punch" ? `${r.left}회 남음` : "";
          $("v-in").style.display = "none";
          // 다음 사람이 바로 설 수 있게 자동으로 비운다.
          setTimeout(reset, 2500);
        } catch (e) {
          $("v-detail").textContent = String(e);
        }
      };

      function reset() {
        $("q").value = "";
        $("v").className = "verdict";
        current = null;
        $("q").focus();
      }
      $("v-next").onclick = reset;
    </script>
  </body>
</html>
