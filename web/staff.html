<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- 🔴 이 화면은 지갑과 **같은 출처**다(가게IP:8790). 여기서 남의
         스크립트가 한 줄이라도 돌면 localStorage 의 12단어를 읽을 수
         있다. 지갑만 막아 둔 것은 반쪽이었다.

         `script-src 'self'` 는 인라인 <script> 를 막는다. 이 화면들은
         본문에 <script> 를 쓰므로 그 해시를 넣는 대신 `unsafe-inline` 을
         쓰되, **가져오는 곳은 자기 자신뿐**으로 못 박는다 — 남이 넣은
         글자가 스크립트로 실행돼도 결과를 밖으로 보낼 길이 없다. -->
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'none'; script-src 'self' 'unsafe-inline';
                   style-src 'unsafe-inline'; img-src 'self' data: http: https:;
                   connect-src 'self'; base-uri 'none'; form-action 'none';
                   frame-ancestors 'none'" />
    <title>주문</title>
    <style>
      /* 직원 화면. 손이 젖어 있고, 한 손이고, 뒤에 줄이 서 있다. */
      :root {
        --bg: #ffffff; --fg: #141518; --muted: #4b5568; --line: #dde3f0;
        --panel: #f7f8fb; --accent: #384192; --warn: #96601a; --ok: #1c7a45; --ravi: #e7731f; --ravi-soft: #8375ae; --ravi-tint: #fdf1e7;
        --on-fill: #ffffff;
        --safe-b: env(safe-area-inset-bottom, 0px);
      }
      @media (prefers-color-scheme: dark) {
        :root { --bg: #0d0f13; --fg: #eceef2; --muted: #b3bdd6; --line: #2a2f3a;
                --panel: #171a21; --accent: #7a90de; --warn: #e0ad50; --ok: #4fbe83;
                --on-fill: #101216;
                --ravi: #f0913f; --ravi-soft: #a294cb; --ravi-tint: #2a1f18; }
      }
      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      body { margin: 0; background: var(--bg); color: var(--fg);
             font: 16px/1.6 -apple-system, BlinkMacSystemFont, system-ui, "Segoe UI", Roboto,
        "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic",
        "Hiragino Sans", "Yu Gothic", "Microsoft YaHei", "PingFang SC",
        "Noto Sans", "Noto Sans Arabic", "Noto Sans Thai", "Noto Sans Devanagari",
        sans-serif;
             padding: 18px 16px calc(88px + var(--safe-b)); }
      h1 { margin: 0 0 4px; font-size: 19px; }
      .sub { color: var(--muted); font-size: 13.5px; }

      .ticket { border: 1px solid var(--line); border-left: 5px solid var(--line);
                border-radius: 13px; padding: 16px 16px; margin-top: 12px; background: var(--panel); }
      .ticket.paid { border-left-color: var(--warn); }
      .ticket.making { border-left-color: var(--accent); }
      .ticket.ready { border-left-color: var(--ok); }
      .no { font-size: 32px; font-weight: 700; line-height: 1.1; }
      .when { color: var(--muted); font-size: 13.5px; margin-top: 4px; }
      .items { margin-top: 8px; font-size: 15px; }
      /* 56px. 주방에서 젖은 손으로 누른다. */
      .ticket button { margin-top: 12px; width: 100%; min-height: 56px; border-radius: 12px;
                       border: 0; background: var(--accent); color: var(--on-fill); font-size: 17px;
                       font-weight: 600; font-family: inherit; cursor: pointer; }

      .empty { border: 1px dashed var(--line); border-radius: 13px; padding: 32px 20px;
               text-align: center; color: var(--muted); font-size: 15px; line-height: 1.8;
               margin-top: 12px; }

      nav { position: fixed; left: 0; right: 0; bottom: 0; background: var(--bg);
            border-top: 1px solid var(--line); display: flex; padding-bottom: var(--safe-b); }
      nav button { flex: 1; border: 0; border-radius: 0; background: none; padding: 16px 4px;
                   font-size: 14px; color: var(--muted); font-family: inherit; }
      nav button.on { color: var(--accent); font-weight: 600; }
      .pane { display: none; } .pane.on { display: block; }

      input { width: 100%; padding: 16px; margin-top: 12px; border-radius: 12px;
              border: 1px solid var(--line); background: var(--bg); color: var(--fg);
              font-size: 18px; font-family: inherit; }
      .mrow { border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px;
              margin-top: 12px; background: var(--panel); }
      .mrow .nm { font-size: 17px; font-weight: 600; }
      .mrow .st { font-size: 14px; margin-top: 4px; }
      .mrow .st.ok { color: var(--ok); } .mrow .st.no { color: var(--warn); }
      .note { margin-top: 24px; font-size: 14px; color: var(--muted); line-height: 1.8; }
      /* 돈이 나가는 버튼이 브라우저 기본 크기로 서 있었다. 이 화면의 주 버튼과
         같은 손가락 크기를 준다. 색은 겁주지 않는다 — 환불은 직원의 정상 업무고,
         빨갛게 만들면 해야 할 때 망설인다. 되돌릴 수 없다는 경고는 아래 문장이
         맡는다. (var(--warn) 은 다크모드에서 밝은 노랑이라 흰 글씨가 안 읽힌다.) */
      #rf-go { width: 100%; min-height: 56px; margin-top: 16px; border: 0;
               border-radius: 12px; background: var(--accent); color: var(--on-fill);
               font-size: 17px; font-weight: 600; font-family: inherit; cursor: pointer; }
      #rf-go:disabled { opacity: .5; }
      #rf-result { margin-top: 12px; font-size: 15px; line-height: 1.7; }
    
      /* 빈 상태는 실패 화면이 아니라 모집 화면이다. Ravi 가 서 있으면
         "고장났나"가 아니라 "아직 시작 전이구나"로 읽힌다. */
      .ravibox { text-align: center; padding: 32px 16px; }
      .ravibox img { width: 176px; height: auto; border-radius: 16px;
        animation: ravifloat 3.6s ease-in-out infinite; }
      .ravibox .rt { margin-top: 12px; font-size: 16px; font-weight: 600; }
      .ravibox .rs { margin-top: 4px; font-size: 14px; color: var(--muted); line-height: 1.6; }
      @keyframes ravifloat { 0%,100% { transform: none; } 50% { transform: translateY(-6px); } }
      @media (prefers-reduced-motion: reduce) { .ravibox img { animation: none; } }

      /* ── 손맛 ────────────────────────────────────────────────────────────
         "즐거운 인터랙션" 은 화려한 애니메이션이 아니라 **누른 것이 눌린 것처럼
         반응하는 것**이다. 아이폰이 처음에 준 느낌이 그거였다.
         전부 CSS 로만 한다 — 이 화면들의 조건은 외부 스크립트 0개다. */

      /* 누르면 실제로 들어간다. 60~90ms 는 "반응이 즉시"로 느껴지는 구간이고,
         이보다 길면 굼떠 보이고 짧으면 안 보인다. */
      button, .btn, a.btn {
        transition: transform .08s ease, box-shadow .16s ease, background .16s ease,
                    border-color .16s ease;
      }
      button:active, .btn:active { transform: scale(.965); }

      /* 손가락이 닿기 전에 먼저 반응한다(마우스가 있는 기기에서만). */
      @media (hover: hover) {
        button:hover:not(:disabled) { border-color: var(--ravi); }
      }

      /* 눌렀을 때 그 자리에서 번지는 빛. ::after 하나로 끝난다. */
      button { position: relative; overflow: hidden; }
      button::after {
        content: ""; position: absolute; inset: 0; border-radius: inherit;
        background: radial-gradient(circle at center, var(--ravi) 0%, transparent 62%);
        opacity: 0; transform: scale(.2); pointer-events: none;
      }
      button:active::after { animation: tap .42s ease-out; }
      @keyframes tap {
        0%   { opacity: .30; transform: scale(.2); }
        100% { opacity: 0;   transform: scale(1.7); }
      }

      /* 값이 바뀐 자리를 눈이 따라가게. 숫자가 조용히 갈리면 못 본다. */
      .pop { animation: pop .34s cubic-bezier(.34,1.56,.64,1); }
      @keyframes pop {
        0% { transform: scale(1); } 45% { transform: scale(1.14); } 100% { transform: scale(1); }
      }

      /* 기다리는 자리. 회색 상자가 가만히 있으면 고장으로 읽힌다. */
      .shimmer { background: linear-gradient(90deg,
        var(--panel) 25%, var(--line) 37%, var(--panel) 63%);
        background-size: 400% 100%; animation: shim 1.4s linear infinite; }
      @keyframes shim { 0% { background-position: 100% 0; } 100% { background-position: 0 0; } }

      /* 새로 들어온 줄은 아래에서 올라온다. 튀어나오면 놀라고, 스며들면 놓친다. */
      .risein { animation: risein .28s ease-out both; }
      @keyframes risein {
        from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; }
      }

      /* 움직임을 줄이는 설정을 켠 사람에게는 전부 멈춘다. 멀미는 취향이 아니다. */
      @media (prefers-reduced-motion: reduce) {
        button, .btn, a.btn { transition: none; }
        button:active, .btn:active { transform: none; }
        button:active::after, .pop, .shimmer, .risein { animation: none; }
      }
      /* 사장 폰의 라비. 카드 하나로 끝난다 — 화면을 옮기면 하던 일을 잃는다. */
      .rowhead { display: flex; gap: 10px; align-items: center; }
      .ravihead { width: 44px; height: 44px; border-radius: 12px; flex: none; }
      .ravilog { margin-top: 10px; display: grid; gap: 8px; }
      .ravilog div { padding: 10px 12px; border-radius: 12px; font-size: 15px;
        line-height: 1.6; white-space: pre-wrap; }
      .ravilog .me { background: var(--accent); color: var(--on-fill); justify-self: end;
        max-width: 88%; }
      .ravilog .ai { background: var(--ravi-tint); color: var(--fg); }
      .raviform { display: flex; gap: 8px; margin-top: 10px; }
      /* 🔴 16px 미만이면 아이폰 사파리가 탭할 때마다 화면을 확대한다. */
      .raviform input { flex: 1; min-height: 48px; font-size: 16px; padding: 0 12px;
        border: 1px solid var(--line); border-radius: 12px;
        background: var(--bg); color: var(--fg); }
      .raviform button { min-height: 48px; padding: 0 18px; font-size: 16px;
        font-weight: 600; border: 0; border-radius: 12px;
        background: var(--ravi); color: #fff; }
      .ravibox.ravi-asleep img { filter: saturate(.55) opacity(.85); }
</style>
  </head>
  <body>
    <h1 id="title">주문</h1>
    <div class="sub" id="when">불러오는 중…</div>

    <div class="pane on" id="p-orders">
      <div id="list"></div>
    </div>

    <div class="pane" id="p-refund">
      <div id="rf-limits" class="note"></div>
      <!-- 체인은 보낸 사람을 기록하지 않는다. 그래서 손님에게 주소를 물어야
           하고, 그 사실을 화면이 먼저 말해야 한다. -->
      <p class="note">
        <b>손님에게 받을 주소를 물어보세요.</b> 체인은 누가 보냈는지 기록하지 않아서
        돌려줄 곳을 우리가 알 수 없습니다.
      </p>
      <label>손님 주소<input id="rf-to" autocomplete="off" spellcheck="false" /></label>
      <label>금액 (원)<input id="rf-krw" type="number" inputmode="numeric" /></label>
      <label>사유<input id="rf-why" value="주문 취소" autocomplete="off" /></label>
      <button id="rf-go">환불하기</button>
      <div id="rf-result"></div>
    </div>

    <div class="pane" id="p-member">
      <input id="mq" placeholder="이름 · 전화 뒷자리" autocomplete="off" />
      <div id="mres"></div>
    </div>
    <!-- 직원도 라비에게 묻는다. 🔴 여기에도 **키 칸이 없다** — 직원 폰에
         키가 들어가면 그건 이미 사장의 키가 아니다. 답은 노드가 만든다.
         (why: web/ravi.js 첫 주석) -->
    <div class="pane" id="p-ravi" data-ravi>
      <div class="rowhead">
        <img src="/raven-head.webp" alt="" class="ravihead" />
        <div><b>라비</b>
          <div class="sub">환불 절차든 회원 확인이든 물어보세요.</div></div>
      </div>
      <div id="raviLog" class="ravilog"></div>
      <div class="raviform">
        <input id="raviQ" type="text" placeholder="예: 부분 환불은 어떻게 하나요?"
               autocomplete="off" enterkeyhint="send" />
        <button id="raviGo">묻기</button>
      </div>
    </div>


    <p class="note">
      이 화면에서는 <b>지갑도 설정도 볼 수 없습니다.</b><br />
      주문을 넘기고, 회원을 확인하고, <b>한도 안에서 환불</b>만 됩니다.
    </p>

    <nav>
      <button class="on" data-p="orders">주문</button>
      <button data-p="member">회원 확인</button>
      <button data-p="refund">환불</button>
      <button data-p="ravi">라비</button>
    </nav>

    <script>
      // 사장이 친 글자라도 그대로 넣지 않는다. 메뉴 이름에 `<` 하나가 들어가면
      // 그 아래 표가 통째로 안 그려지고, 화면은 "매출이 없습니다" 처럼 보인다.
      const esc = (v) =>
        String(v ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;")
          .replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");

      const $ = (id) => document.getElementById(id);
      const q = new URLSearchParams(location.search).get("t");
      const token = q || sessionStorage.getItem("ft") || "";
      if (q) {
        sessionStorage.setItem("ft", token);
        history.replaceState(null, "", "/staff");
      }
      const H = { "x-playx-token": token, "content-type": "application/json" };

      // 환불 탭이 이걸 부르는데 정의가 없었다. 함수가 없으면 그 줄에서 멈추므로
      // 화면은 오류 없이 그냥 비어 있었다 — 직원은 "환불이 안 되네" 라고 읽는다.
      const api = (path, body) =>
        fetch(path, body ? { method: "POST", headers: H, body: JSON.stringify(body) } : { headers: H })
          .then((r) => r.json());

      const ago = (s) => {
        const d = Math.floor(Date.now() / 1000) - s;
        if (d < 60) return "방금";
        if (d < 3600) return `${Math.floor(d / 60)}분 전`;
        return `${Math.floor(d / 3600)}시간 전`;
      };

      document.querySelectorAll("[data-p]").forEach((b) => {
        b.onclick = () => {
          document.querySelectorAll("[data-p]").forEach((x) => x.classList.toggle("on", x === b));
          document.querySelectorAll(".pane").forEach((p) =>
            p.classList.toggle("on", p.id === `p-${b.dataset.p}`)
          );
          $("title").textContent =
            { orders: "주문", member: "회원 확인", refund: "환불" }[b.dataset.p] || "주문";
          if (b.dataset.p === "refund") loadLimits();
        };
      });

      // ── 환불 ──────────────────────────────────────────────────────
      async function loadLimits() {
        try {
          const l = await api("/api/staff/refund/limits");
          $("rf-limits").innerHTML =
            `한 번에 <b>${l.once_krw.toLocaleString()}원</b>까지 · ` +
            `오늘 남은 한도 <b>${l.left_krw.toLocaleString()}원</b>` +
            (l.used_krw > 0 ? ` (${l.used_krw.toLocaleString()}원 나감)` : "");
        } catch (e) {
          $("rf-limits").textContent = String(e.message || e);
        }
      }

      // 금액을 치는 동안 버튼이 따라 바뀐다. 환불은 직원이 매일 하는 일이라
      // 확인창을 넣으면 계산대가 멈춘다 — 대신 대가를 버튼에 박는다.
      const rfLabel = () => {
        const n = Number($("rf-krw").value || 0);
        $("rf-go").textContent = n > 0 ? `${n.toLocaleString()}원 환불하기` : "환불하기";
      };
      $("rf-krw").addEventListener("input", rfLabel);

      $("rf-go").onclick = async () => {
        const to = $("rf-to").value.trim();
        const krw = Number($("rf-krw").value);
        if (!to || !(krw > 0)) {
          $("rf-result").innerHTML = `<div class="bad">주소와 금액을 넣어 주세요.</div>`;
          return;
        }
        $("rf-go").disabled = true;
        const was = $("rf-go").textContent;
        $("rf-go").textContent = "보내는 중…";
        try {
          const r = await api("/api/staff/refund", {
            to, krw, reason: $("rf-why").value, passphrase: null,
          });
          if (r.error) throw new Error(r.error);
          $("rf-result").innerHTML =
            `<div class="ok"><b>${r.krw.toLocaleString()}원 (${r.rvn} RVN) 돌려줬습니다.</b><br />
             오늘 남은 한도 ${r.left_krw.toLocaleString()}원 · 사장님께 알림이 갔습니다.</div>`;
          $("rf-to").value = "";
          $("rf-krw").value = "";
          loadLimits();
        } catch (e) {
          $("rf-result").innerHTML = `<div class="bad">${e.message || e}</div>`;
        }
        $("rf-go").textContent = was;
        $("rf-go").disabled = false;
      };

      const NEXT = { paid: "making", making: "ready", ready: "done", unknown: "making" };
      const LABEL = { paid: "만들기 시작", making: "나왔다고 알리기", ready: "전달 완료",
            unknown: "만들기 시작" };
      const SHOWN = { paid: "새 주문", making: "만드는 중", ready: "나옴",
            // 앱을 다시 켜면 상태 표가 빈다. 그때 "결제됨" 으로 그리면
            // 직원이 안 만들어도 될 것을 만든다. 그래도 버튼은 남겨 둔다 —
            // 사장이 오늘 들어온 결제를 처리할 길이 없어지면 안 된다.
            unknown: "확인 필요",
          };

      async function load() {
        try {
          const [o, st] = await Promise.all([
            fetch("/api/admin/orders", { headers: H }).then((r) => r.json()),
            fetch("/api/admin/states", { headers: H }).then((r) => r.json()),
          ]);
          const states = new Map((st.orders || []).map((x) => [x.address, x]));
          // 커피값은 1확인을 기다리지 않는다(`accept_now`). settled 만 보면
          // 사장이 "내주세요"를 보는데 주방 화면은 빈 칸이 된다.
          const list = (o.payments || []).filter((p) => p.accept_now || p.settled);

          // done 은 숨긴다. 끝난 것을 계속 보여주면 새 주문이 아래로 밀린다.
          // 🔴 모르는 주문을 `paid` 로 치고 있었다. 앱을 다시 켜면 상태 표가
          // 비므로, 어제 것까지 전부 「결제됨」으로 번호표에 떴다.
          // 모르면 모른다고 해야 한다 — 직원이 만들면 안 되는 것을 만든다.
          const live = list.filter((p) => (states.get(p.address)?.state || "unknown") !== "done");

          $("list").innerHTML = live.length
            ? live
                .map((p) => {
                  const s = states.get(p.address)?.state || "unknown";
                  const t = states.get(p.address)?.ticket;
                  const tbl = states.get(p.address)?.table;
                  return `<div class="ticket ${s} risein">
                    <!-- 자리로 가져다주는 가게는 번호를 부르지 않는다.
                         테이블이 있으면 그게 번호보다 먼저 보여야 한다. -->
                    <div class="no">${tbl ? tbl + "번 테이블" : (t || "—")}</div>
                    ${tbl && t ? `<div class="when">주문번호 ${t}</div>` : ""}
                    <div class="when">${SHOWN[s]} · ${p.time ? ago(p.time) : ""}</div>
                    <div class="items">${p.amount} RVN</div>
                    ${NEXT[s] ? `<button data-adv="${p.address}" data-to="${NEXT[s]}">${LABEL[s]}</button>` : ""}
                  </div>`;
                })
                .join("")
            : `<div class="ravibox">
                 <img src="/raven-sleep.webp" alt="" />
                 <div class="rt">조용하네요</div>
                 <div class="rs">손님이 QR로 주문하면 <b>번호표가 여기 뜹니다.</b></div>
               </div>`;

          $("list").querySelectorAll("[data-adv]").forEach((b) => {
            b.onclick = async () => {
              b.disabled = true;
              await fetch("/api/admin/state", {
                method: "POST", headers: H,
                body: JSON.stringify({ address: b.dataset.adv, state: b.dataset.to }),
              });
              load();
            };
          });
          $("when").textContent = `${new Date().toLocaleTimeString(undefined)} 기준 · ${live.length}건`;
        } catch (e) {
          $("when").textContent = String(e);
        }
      }

      let mt;
      $("mq").oninput = () => {
        clearTimeout(mt);
        mt = setTimeout(findMember, 250);
      };

      async function findMember() {
        const query = $("mq").value.trim();
        if (query.length < 2) { $("mres").innerHTML = ""; return; }
        try {
          const r = await fetch("/api/scan/check", {
            method: "POST", headers: H, body: JSON.stringify({ query }),
          }).then((x) => x.json());
          $("mres").innerHTML = r.found
            ? `<div class="mrow">
                 <div class="nm">${esc(r.name || "")}</div>
                 <div class="st ${r.valid ? "ok" : "no"}">
                   ${r.valid ? "들어오셔도 됩니다" : r.why || "안 됩니다"}
                   ${r.valid && r.kind === "punch" ? ` · ${r.left}회 남음` : ""}
                 </div>
               </div>`
            : `<div class="mrow"><div class="st no">찾지 못했습니다</div></div>`;
        } catch (e) {
          $("mres").innerHTML = `<div class="mrow"><div class="st no">${e}</div></div>      `;
        }
      }

      load();
      setInterval(load, 20000);
    </script>
      <script src="/ravi.js"></script>

    <script>
      /* 라비는 **가게 컴퓨터의 열쇠**로 깨어난다. 이 폰에는 키를 넣지 않는다.
         (why: ravi.js 첫 주석) */
      (async () => {
        const st = await window.Ravi.status();
        document.querySelectorAll("[data-ravi]").forEach((el) => {
          if (st.awake) return;                 // 깨어 있으면 원래대로 둔다
          el.innerHTML = window.Ravi.sleepingBox(window.t);
        });
      })();
    </script>

    <script>
      /* 라비는 **노드의 열쇠**로 답한다. 이 폰에는 키가 없고, 넣지도 않는다. */
      (() => {
        const log = document.getElementById("raviLog");
        const box = document.getElementById("raviQ");
        const go = document.getElementById("raviGo");
        if (!log || !box || !go) return;

        const say = (who, text) => {
          const d = document.createElement("div");
          d.className = who;
          d.textContent = text;           // 🔴 textContent. 답을 HTML 로 넣으면
          log.appendChild(d);             //    모델이 뱉은 태그가 실행된다.
          d.scrollIntoView({ block: "nearest" });
        };

        let busy = false;
        const ask = async () => {
          const text = box.value.trim();
          if (!text || busy) return;
          busy = true; go.disabled = true; box.value = "";
          say("me", text);
          const wait = document.createElement("div");
          wait.className = "ai"; wait.textContent = "생각하는 중…";
          log.appendChild(wait);
          try {
            const r = await fetch("/api/owner-ask", {
              method: "POST",
              headers: H,
              body: JSON.stringify({ question: text }),
            });
            const j = await r.json();
            wait.remove();
            say("ai", j.answer || j.error || "답을 받지 못했습니다.");
          } catch (e) {
            wait.remove();
            /* 가게 와이파이는 끊긴다. 원문 대신 다음에 할 일을 적는다. */
            say("ai", "가게 컴퓨터에 닿지 못했습니다. 같은 와이파이인지 확인해 주세요.");
          } finally {
            busy = false; go.disabled = false; box.focus();
          }
        };
        go.addEventListener("click", ask);
        box.addEventListener("keydown", (e) => { if (e.key === "Enter") ask(); });
      })();
    </script>
<script src="/i18n.js"></script>
  </body>
</html>
