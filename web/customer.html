<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- 🔴 이 화면은 지갑과 **같은 출처**다(가게IP:8790). 여기서 남의
         스크립트가 한 줄이라도 돌면 localStorage 의 12단어를 읽을 수
         있다. 지갑만 막아 둔 것은 반쪽이었다.

         `script-src 'self'` 는 인라인 <script> 를 막는다. 이 화면들은
         본문에 <script> 를 쓰므로 그 해시를 넣는 대신 `unsafe-inline` 을
         쓰되, **가져오는 곳은 자기 자신뿐**으로 못 박는다 — 남이 넣은
         글자가 스크립트로 실행돼도 결과를 밖으로 보낼 길이 없다. -->
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'none'; script-src 'self' 'unsafe-inline';
                   style-src 'unsafe-inline'; img-src 'self' data:;
                   connect-src 'self'; base-uri 'none'; form-action 'none';
                   frame-ancestors 'none'" />
    <title>주문</title>
    <style>
      /* 손님 화면. 매장 조명 아래 서서 한 손으로 쓰는 것을 전제한다. */
      :root {
        --bg: #ffffff; --fg: #141518; --muted: #6b7280; --line: #e6e7ea;
        --panel: #fafafb; --accent: #3b3f8f; --warn: #b45309; --ravi: #e7731f; --ravi-soft: #8375ae; --ravi-tint: #fdf1e7;
        --safe-b: env(safe-area-inset-bottom, 0px);
      }
      @media (prefers-color-scheme: dark) {
        :root { --bg: #101114; --fg: #eceef2; --muted: #9aa0ab; --line: #26282e;
                --panel: #17191d; --accent: #8d92e8; --warn: #d99b3f; } --ravi: #f0913f; --ravi-soft: #a294cb; --ravi-tint: #2a1f18;
      }
      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      body { margin: 0; background: var(--bg); color: var(--fg);
             font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif;
             padding-bottom: calc(124px + var(--safe-b)); }
      header { padding: 20px 16px 12px; border-bottom: 1px solid var(--line); }
      header img { width: 100%; max-height: 168px; object-fit: cover; border-radius: 12px;
                   margin-bottom: 12px; display: block; }
      h1 { margin: 0; font-size: 21px; letter-spacing: -0.02em; }
      .sub { color: var(--muted); font-size: 14px; margin-top: 4px; }
      .tags { display: flex; gap: 4px; margin-top: 8px; }
      /* 맨 위 한 줄. 스크롤하기 전에 보여야 한다. */
      .openbar { display: flex; align-items: center; gap: 8px; padding: 12px 16px;
                 font-size: 15px; font-weight: 600; }
      .openbar.on  { background: rgba(28,122,69,.12); color: var(--ok, #1c7a45); }
      .openbar.off { background: rgba(150,96,26,.14); color: var(--warn, #96601a); }
      .openbar .sub { font-weight: 500; opacity: .85; }
      .openbar .dot { width: 9px; height: 9px; border-radius: 50%; background: currentColor;
                      opacity: .45; flex: none; }
      .openbar .dot.on { opacity: 1; }
      .tablebar { padding: 8px 16px; font-size: 15px; font-weight: 600;
                  background: var(--panel); border-bottom: 1px solid var(--line); }
      .tag { font-size: 12.5px; padding: 4px 8px; border-radius: 999px; border: 1px solid var(--line);
             color: var(--muted); }

      main { padding: 8px 16px 0; }
      .item { display: flex; gap: 12px; align-items: center; padding: 12px 0;
              border-bottom: 1px solid var(--line); }
      .item img { width: 62px; height: 62px; object-fit: cover; border-radius: 10px; flex: none;
                  background: var(--panel); }
      .item .nm { font-weight: 600; font-size: 15px; }
      .item .pr { color: var(--fg); font-size: 16px; font-weight: 600; margin-top: 4px; }
      .item .rv { color: var(--muted); font-size: 13px; margin-top: 4px; }
      .qty { display: flex; align-items: center; gap: 4px; margin-left: auto; flex: none; }
      /* 결제에서 가장 큰 것이 지갑 열기여야 한다. 주소도 QR 도 그다음이다. */
      .walletbtn { display: block; margin: 12px 0 4px; padding: 16px;
                   border-radius: 13px; background: var(--accent, #6b78d6); color: #fff;
                   font-size: 18px; font-weight: 700; text-align: center;
                   text-decoration: none; }

      /* 44px 미만은 손가락으로 못 누른다. */
      .qty button { width: 44px; height: 44px; border-radius: 9px; border: 1px solid var(--line);
                    background: var(--bg); color: var(--fg); font-size: 17px; cursor: pointer; }
      .qty span { min-width: 22px; text-align: center; font-variant-numeric: tabular-nums; }

      .ask { margin: 16px 0 24px; padding: 12px; border: 1px solid var(--line);
             border-radius: 12px; background: var(--panel); }
      .ask h3 { margin: 0 0 8px; font-size: 15px; font-weight: 600; }
      .ask .row { display: flex; gap: 8px; }
      .ask input { flex: 1; min-height: 46px; min-width: 0; padding: 12px 12px; border-radius: 9px;
                   border: 1px solid var(--line); background: var(--bg); color: var(--fg);
                   font-size: 15px; font-family: inherit; }
      .ask button { padding: 0 16px; border-radius: 9px; border: 0; background: var(--accent);
                    color: #fff; font-size: 15px; min-height: 46px; font-family: inherit; cursor: pointer; }
      .answer { margin-top: 12px; font-size: 15px; line-height: 1.7;
        display: flex; gap: 8px; align-items: flex-start; }
      .answer .anstxt { white-space: pre-wrap; min-width: 0; flex: 1; }
      .ansravi { width: 28px; height: 28px; border-radius: 9px; flex: none; margin-top: 1px; }
      .answer.err { display: block; }
      .answer.err { color: var(--warn); }
      .aidis { font-size: 12.5px; color: var(--muted); margin-top: 8px; line-height: 1.5; }

      .bar { position: fixed; left: 0; right: 0; bottom: 0; background: var(--bg);
             border-top: 1px solid var(--line); padding: 12px 18px calc(12px + var(--safe-b));
             display: flex; align-items: center; gap: 12px; }
      .bar .tot { font-size: 17px; font-weight: 600; }
      .bar .tot small { display: block; font-size: 13px; font-weight: 400; color: var(--muted); }
      .bar button { margin-left: auto; padding: 12px 24px; border-radius: 11px; border: 0;
                    background: var(--accent); color: #fff; font-size: 15px; font-weight: 600;
                    font-family: inherit; cursor: pointer; }
      .bar button:disabled { opacity: 0.4; }

      dialog { border: 0; border-radius: 16px; padding: 0; background: var(--bg); color: var(--fg);
               width: min(92vw, 420px); }
      dialog::backdrop { background: rgba(0,0,0,0.55); }
      .pay { padding: 20px 20px; text-align: center; }
      .pay h2 { margin: 0 0 4px; font-size: 17px; }
      .pay .amt { font-size: 27px; font-weight: 700; margin: 12px 0 4px;
                  font-variant-numeric: tabular-nums; }
      .pay .fiat { color: var(--muted); font-size: 14px; }
      .pay svg { width: 200px; height: 200px; margin: 16px auto 8px; display: block;
                 background: #fff; padding: 8px; border-radius: 10px; }
      .pay code { display: block; font-size: 11.5px; word-break: break-all; color: var(--muted);
                  margin-top: 4px; }
      .pay .timer { margin-top: 12px; font-size: 14px; font-weight: 600; color: var(--warn); }
      .pay .close { margin-top: 16px; width: 100%; padding: 12px; border-radius: 10px;
                    border: 1px solid var(--line); background: var(--bg); color: var(--fg);
                    font-size: 14px; font-family: inherit; cursor: pointer; }
      .empty { color: var(--muted); padding: 32px 0; text-align: center; font-size: 14px; }
    
      /* 캐릭터. 상태가 바뀔 때 살짝 떠오르며 나타난다 — 애니메이션이 아니라
         "바뀌었다"는 신호다. 움직임을 줄이는 설정을 켠 손님에게는 안 움직인다. */
      .face { display: block; margin: 0 auto 10px; width: 132px; height: auto;
        border-radius: 12px; animation: facein .34s ease-out both; }
      @keyframes facein {
        from { opacity: 0; transform: translateY(7px) scale(.96); }
        to   { opacity: 1; transform: none; }
      }
      /* 기다리는 표정만 아주 천천히 숨 쉰다. 화면이 멈춘 게 아니라는 표시다. */
      .face[src*="wait"] { animation: facein .34s ease-out both, breathe 3.4s ease-in-out .34s infinite; }
      @keyframes breathe { 0%,100% { transform: none; } 50% { transform: translateY(-3px); } }
      @media (prefers-reduced-motion: reduce) {
        .face, .face[src*="wait"] { animation: none; }
      }

      /* 빈 상태는 실패 화면이 아니라 모집 화면이다. Ravi 가 서 있으면
         "고장났나"가 아니라 "아직 시작 전이구나"로 읽힌다. */
      .ravibox { text-align: center; padding: 32px 16px; }
      .ravibox img { width: 132px; height: auto; border-radius: 16px;
        animation: ravifloat 3.6s ease-in-out infinite; }
      .ravibox .rt { margin-top: 12px; font-size: 16px; font-weight: 600; }
      .ravibox .rs { margin-top: 4px; font-size: 14px; color: var(--muted); line-height: 1.6; }
      @keyframes ravifloat { 0%,100% { transform: none; } 50% { transform: translateY(-6px); } }
      @media (prefers-reduced-motion: reduce) { .ravibox img { animation: none; } }

      /* ── 손맛 ────────────────────────────────────────────────────────────
         "즐거운 인터랙션" 은 화려한 애니메이션이 아니라 **누른 것이 눌린 것처럼
         반응하는 것**이다. 아이폰이 처음에 준 느낌이 그거였다.
         전부 CSS 로만 한다 — 이 화면들의 조건은 외부 스크립트 0개다. */

      /* 누르면 실제로 들어간다. 60~90ms 는 "반응이 즉시"로 느껴지는 구간이고,
         이보다 길면 굼떠 보이고 짧으면 안 보인다. */
      button, .btn, a.btn {
        transition: transform .08s ease, box-shadow .16s ease, background .16s ease,
                    border-color .16s ease;
      }
      button:active, .btn:active { transform: scale(.965); }

      /* 손가락이 닿기 전에 먼저 반응한다(마우스가 있는 기기에서만). */
      @media (hover: hover) {
        button:hover:not(:disabled) { border-color: var(--ravi); }
      }

      /* 눌렀을 때 그 자리에서 번지는 빛. ::after 하나로 끝난다. */
      button { position: relative; overflow: hidden; }
      button::after {
        content: ""; position: absolute; inset: 0; border-radius: inherit;
        background: radial-gradient(circle at center, var(--ravi) 0%, transparent 62%);
        opacity: 0; transform: scale(.2); pointer-events: none;
      }
      button:active::after { animation: tap .42s ease-out; }
      @keyframes tap {
        0%   { opacity: .30; transform: scale(.2); }
        100% { opacity: 0;   transform: scale(1.7); }
      }

      /* 값이 바뀐 자리를 눈이 따라가게. 숫자가 조용히 갈리면 못 본다. */
      .pop { animation: pop .34s cubic-bezier(.34,1.56,.64,1); }
      @keyframes pop {
        0% { transform: scale(1); } 45% { transform: scale(1.14); } 100% { transform: scale(1); }
      }

      /* 기다리는 자리. 회색 상자가 가만히 있으면 고장으로 읽힌다. */
      .shimmer { background: linear-gradient(90deg,
        var(--panel) 25%, var(--line) 37%, var(--panel) 63%);
        background-size: 400% 100%; animation: shim 1.4s linear infinite; }
      @keyframes shim { 0% { background-position: 100% 0; } 100% { background-position: 0 0; } }

      /* 새로 들어온 줄은 아래에서 올라온다. 튀어나오면 놀라고, 스며들면 놓친다. */
      .risein { animation: risein .28s ease-out both; }
      @keyframes risein {
        from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; }
      }

      /* 움직임을 줄이는 설정을 켠 사람에게는 전부 멈춘다. 멀미는 취향이 아니다. */
      @media (prefers-reduced-motion: reduce) {
        button, .btn, a.btn { transition: none; }
        button:active, .btn:active { transform: none; }
        button:active::after, .pop, .shimmer, .risein { animation: none; }
      }
      /* 진행 단계 */
      .statecard { margin-top: 16px; padding: 16px; border-radius: 12px;
        background: var(--panel); }
      .statecard.ready { background: var(--accent); color: #fff; }
      .statecard .tk { font-size: 40px; font-weight: 700; line-height: 1.05;
        font-variant-numeric: tabular-nums; }
      .steps { display: flex; align-items: flex-start; gap: 4px; margin-top: 16px; }
      .stp { flex: 1; text-align: center; position: relative; }
      /* 단계 사이를 잇는 선. 지난 단계는 채워진다. */
      .stp::before { content: ""; position: absolute; top: 7px; left: -50%;
        width: 100%; height: 2px; background: currentColor; opacity: .18; }
      .stp:first-child::before { display: none; }
      .stp.on::before { opacity: .55; }
      .stp .dot { display: block; width: 16px; height: 16px; margin: 0 auto;
        border-radius: 999px; background: currentColor; opacity: .18;
        position: relative; z-index: 1; transition: opacity .25s ease, transform .25s ease; }
      .stp.on .dot { opacity: 1; }
      /* 지금 단계만 숨 쉰다. 다 채워진 점 셋은 어디가 지금인지 안 알려준다. */
      .stp.on:last-of-type .dot, .stp.on + .stp:not(.on) { }
      .stp .lb { display: block; margin-top: 6px; font-size: 12.5px; opacity: .6; }
      .stp.on .lb { opacity: 1; font-weight: 600; }
      @media (prefers-reduced-motion: reduce) { .stp .dot { transition: none; } }
      .soldout { font-size: 14px; color: var(--muted); padding: 0 8px; }
      /* 몇 개 안 남았을 때만. 서두를 이유가 있을 때만 말한다. */
      .fewleft { font-size: 13px; color: var(--ravi); font-weight: 600; margin-top: 2px; }
</style>
  </head>
  <body>
    <div class="openbar" id="openbar"></div>

    <header>
      <div id="icon"></div>
      <h1 id="name">불러오는 중…</h1>
      <div class="sub" id="desc"></div>
      <div class="sub" id="loc"></div>
      <div class="tags" id="tags"></div>
    </header>

    <main>
      <div id="menu"><div class="empty">메뉴를 불러오는 중…</div></div>

      <div class="ask" id="ask" style="display:none">
        <h3>궁금한 것 물어보기</h3>
        <div class="row">
          <input id="q" placeholder="견과류 들어간 메뉴 있나요?" autocomplete="off" />
          <button id="qgo">묻기</button>
        </div>
        <div class="answer" id="a"></div>
        <div class="aidis">AI가 가게가 올린 정보로만 답합니다. 확실하지 않으면 가게에 직접 확인하세요.</div>
      </div>
    </main>

    <div class="bar">
      <div class="tot"><span id="total">₩0</span><small id="totrvn"></small></div>
      <button id="order" disabled>주문하기</button>
    </div>

    <dialog id="paydlg">
      <div class="pay">
        <h2 id="p-title">지갑 열기를 누르세요</h2>
        <div class="fiat" id="p-shop"></div>
        <div class="amt" id="p-rvn"></div>
        <div class="fiat" id="p-fiat"></div>
        <!-- 손님은 이 화면을 자기 폰으로 보고 있다. 자기 화면의 QR 을 자기
             폰으로 찍을 수는 없다. 그래서 누르면 지갑이 열리는 버튼이 먼저다.
             QR 은 옆 사람 폰이나 태블릿으로 볼 때를 위해 남긴다. -->
        <a id="p-open" class="walletbtn" href="#">지갑 열기</a>
        <div class="fiat" id="p-openhint">지갑이 열리면 금액이 채워져 있습니다. 그대로 보내세요.</div>
        <!-- 지갑이 없는 손님에게 갈 곳을 준다. 가게 로컬이 아니라 rvn.ex.erci.se
             로 보낸다 — 브라우저 저장소는 출처마다 나뉘어서, 가게 주소에서
             만든 지갑은 그 가게에서만 보인다. -->
        <div class="fiat" style="margin-top:8px">
          지갑이 없으신가요?
          <a href="https://rvn.ex.erci.se/wallet" target="_blank" rel="noopener">1분이면 만듭니다</a>
        </div>
        <a id="p-qrlink" href="#"><div id="p-qr"></div></a>
        <code id="p-addr"></code>
        <div class="fiat">지갑이 안 열리면 위 주소를 길게 눌러 복사하세요.</div>
        <div class="timer" id="p-timer"></div>
        <div id="p-state"></div>
        <button class="close" id="p-close">닫기</button>
      </div>
    </dialog>

    <script>
      const $ = (id) => document.getElementById(id);
      let shop = {}, items = [], cart = {}, left = {}, rate = null, symbol = "₩", currency = "KRW";
      let openState = { open: true, say: "" };
      // 손님 QR 이 ?table=3 을 달고 있으면 그 자리에서 온 주문이다. 없으면
      // 카운터 주문 — 지금까지처럼 번호로 부른다.
      const TABLE = (new URLSearchParams(location.search).get("table") || "").trim().slice(0, 12);

      // ── 메뉴판(키오스크) 모드 ────────────────────────────────────────
      //
      // 같은 화면인데 기기가 다르다. 손님 폰이면 그 사람 것이고, 매장 태블릿이면
      // 여러 사람이 번갈아 쓴다. 다른 것은 하나뿐 — **끝나는 방식**이다.
      //
      // 태블릿에 앞사람 장바구니가 남아 있으면 그건 사고다. 그래서 주문이
      // 끝나면 스스로 처음으로 돌아간다. 그리고 결제는 손님 자기 폰으로
      // 넘긴다 — 매장 태블릿에 지갑을 두면 안 되니까.
      const KIOSK = new URLSearchParams(location.search).get("kiosk") === "1";
      let idleTimer = null;

      function kioskReset() {
        // 결제 중에는 치우지 않는다. 지갑 앱을 열고 QR 을 찍고 금액을 확인하는
        // 데 90초는 흔히 걸리고, 그때 화면을 지우면 이미 보낸 돈이 어디로 갔는지
        // 손님이 알 길이 없어진다. 결제가 끝나면 그때 다시 센다.
        if (paying) {
          idleTimer = setTimeout(kioskReset, 90_000);
          return;
        }
        cart = {};
        items.forEach((_, i) => {
          const el = document.getElementById(`c${i}`);
          if (el) el.textContent = "0";
        });
        $("total").textContent = fmt(0);
        $("totrvn").textContent = "";
        $("order").disabled = true;
        $("order").textContent = "주문하기";
        paying = false;
        clearInterval(statePoll);
        clearInterval(timer);
        try { $("paydlg").close(); } catch {}
        window.scrollTo(0, 0);
      }

      // 손을 뗀 지 오래면 알아서 치운다. 다음 손님이 앞사람 화면을 보면 안 된다.
      function touchKiosk() {
        if (!KIOSK) return;
        clearTimeout(idleTimer);
        idleTimer = setTimeout(kioskReset, 90_000);
      }
      if (KIOSK) {
        ["click", "touchstart", "keydown"].forEach((e) =>
          document.addEventListener(e, touchKiosk, { passive: true })
        );
      }

      const fmt = (n) =>
        currency === "RVN" ? `${n} RVN` : `${symbol}${Math.round(n).toLocaleString()}`;

      // ── 남의 글자를 화면에 넣기 전에 ──────────────────────────────────
      //
      // 🔴 가게 이름·메뉴·간판 주소는 **체인에서 오는 남의 글자**다. 아무나
      // 500 RVN 이면 SHOP. 자산을 발행해 무엇이든 적을 수 있다.
      //
      // 이 화면은 지갑과 **같은 출처**(가게IP:8790)라, 여기서 스크립트가 한 줄
      // 돌면 localStorage 의 12단어가 사정권에 들어온다. CSP 만으로는 못 막는다
      // — 인라인 스크립트를 허용해야 이 화면이 돌기 때문에 `onerror=` 같은
      // 속성이 그대로 통한다. **글자를 넣기 전에 바꾸는 것이 유일한 방어다.**
      const esc = (v) =>
        String(v ?? "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");

      // 주소는 http/https 만. javascript: 를 링크에 넣으면 그건 우리가 뿌리는
      // 공격이 된다. data: 도 막는다 — 이미지인 척하는 스크립트가 들어온다.
      const safeUrl = (u) => (/^https?:\/\//i.test(String(u || "")) ? String(u) : "");

      const fmtRvn = (n) => {
        // 커피 한 잔이 1,183 RVN 이다. 소수점 둘째 자리는 1.5원짜리 정보라
        // 손님에게는 잡음이고, 천단위 구분이 없으면 자릿수를 눈으로 못 센다.
        // 1 RVN 미만일 때만 소수를 보여 준다 — 거기서는 그게 값의 전부다.
        if (!isFinite(n)) return "";
        if (n >= 100) return Math.round(n).toLocaleString() + " RVN";
        if (n >= 1) return n.toFixed(1) + " RVN";
        return n.toFixed(3) + " RVN";
      };

      async function load() {
        const r = await fetch("/api/shop").then((x) => x.json());
        shop = r.shop || {};
        $("name").textContent = shop.name || "가게";
        $("desc").textContent = shop.description || "";
        $("loc").textContent = shop.location || "";
        if (safeUrl(shop.icon))
          $("icon").innerHTML = `<img src="${esc(safeUrl(shop.icon))}" alt="" />`;
        $("tags").innerHTML =
          (shop.pickup ? `<span class="tag">매장·포장</span>` : "") +
          (shop.delivery ? `<span class="tag">배달</span>` : "");

        // 노드가 켜져 있는 것과 가게가 열려 있는 것은 다르다. 새벽에도 노드는
        // 돌기 때문에, 여기서 말해 주지 않으면 아무도 만들지 않을 커피가
        // 결제된다. 맨 위에 두는 이유는 스크롤하기 전에 보여야 해서다.
        if (TABLE) {
          $("openbar").insertAdjacentHTML("afterend",
            `<div class="tablebar">${TABLE}번 테이블</div>`);
        }
        openState = r.open || { open: true, say: "" };
        $("openbar").innerHTML = openState.open
          ? `<span class="dot on"></span>지금 영업 중${openState.say ? ` · <span class="sub">${openState.say}</span>` : ""}`
          : `<span class="dot"></span>지금은 주문을 받지 않습니다${openState.say ? ` · <span class="sub">${openState.say}</span>` : ""}`;
        $("openbar").className = openState.open ? "openbar on" : "openbar off";

        items = shop.menu || [];
        left = r.left || {};
        currency = shop.currency || "KRW";
        symbol = currency === "USD" ? "$" : currency === "RVN" ? "" : "₩";
        rate = shop.rate || null;

        $("menu").innerHTML = items.length
          ? items
              .map(
                (it, i) => `<div class="item">
                  ${it.image ? `<img src="${esc(safeUrl(shop.gateway) + "/ipfs/" + String(it.image).replace(/[^A-Za-z0-9]/g, ""))}" alt="" loading="lazy" />` : ""}
                  <div>
                    <div class="nm">${esc(it.name || "")}</div>
                    <div class="pr">${fmt(it.price || 0)}</div>
                    ${rate && currency !== "RVN" ? `<div class="rv">${fmtRvn((it.price || 0) / rate)}</div>` : ""}
                    ${
                      // 넉넉할 때 "37개 남음" 은 잡음이다. 서두를 이유가 있을
                      // 때만 말한다.
                      typeof left[it.name] === "number" && left[it.name] > 0 && left[it.name] <= 5
                        ? `<div class="fewleft">${esc(left[it.name])}개 남음</div>`
                        : ""
                    }
                  </div>
                  <div class="qty">
                    ${
                      // 남은 수량. null 은 무제한이라 아무 말도 하지 않는다 —
                      // 대부분의 메뉴가 이것이고, 전부에 숫자가 붙으면 시끄럽다.
                      left[it.name] === 0
                        ? `<span class="soldout">품절</span>`
                        : `<button data-m="${i}">−</button><span id="c${i}">0</span><button data-p="${i}">+</button>`
                    }
                  </div>
                </div>`
              )
              .join("")
          : `<div class="ravibox">
                 <img src="/raven-wait.webp" alt="" />
                 <div class="rt">메뉴를 준비하고 있어요</div>
                 <div class="rs">이 가게는 아직 팔 것을 올리지 않았습니다.<br />
                   궁금한 것은 아래에서 물어보실 수 있어요.</div>
               </div>`;

        document.querySelectorAll("[data-p]").forEach((b) => {
          b.onclick = () => bump(+b.dataset.p, 1);
        });
        document.querySelectorAll("[data-m]").forEach((b) => {
          b.onclick = () => bump(+b.dataset.m, -1);
        });
        if (r.ai) $("ask").style.display = "";
      }

      // 값이 바뀐 자리를 한 번 튀게 한다. 애니메이션을 다시 걸려면 클래스를
      // 뗐다가 붙여야 하고, 그 사이 브라우저가 다시 계산하게 만들어야 한다.
      function pop(el) {
        if (!el) return;
        el.classList.remove("pop");
        void el.offsetWidth;
        el.classList.add("pop");
      }

      function bump(i, d) {
        const before = cart[i] || 0;
        const cap = typeof left[items[i]?.name] === "number" ? left[items[i].name] : Infinity;
        // 남은 것보다 많이 담게 두면, 주문을 눌렀을 때 서버가 거절한다.
        // 담을 때 막는 편이 낫다 — 거절은 이유를 읽어야 하고 담기는 안 읽어도 된다.
        cart[i] = Math.min(cap, Math.max(0, before + d));
        if (cart[i] !== before) { pop($("total")); pop($(`c${i}`)); }
        $(`c${i}`).textContent = cart[i];
        const total = items.reduce((s, it, k) => s + (cart[k] || 0) * (it.price || 0), 0);
        $("total").textContent = fmt(total);
        $("totrvn").textContent =
          rate && currency !== "RVN" && total ? fmtRvn(total / rate) : "";
        $("order").disabled = total <= 0 || !openState.open;
      }

      // 결제 창이 떠 있는 동안인가. 떠 있으면 주문하기를 되살리지 않는다.
      let paying = false;

      $("order").onclick = async () => {
        // 🔴 알림 권한은 **주문을 누른 순간**에만 묻는다.
        //
        // 화면을 열자마자 물으면 대부분 거절한다 — 뭘 알려 주겠다는 건지 모르는
        // 상태에서 묻기 때문이다. 주문을 누른 사람은 "다 되면 알려 준다" 를
        // 원하는 사람이라, 그때 물으면 대부분 허락한다.
        // 브라우저는 사용자가 누른 직후에만 이 창을 띄워 준다는 제약도 있다.
        if ("Notification" in window && Notification.permission === "default") {
          try {
            await Notification.requestPermission();
          } catch {}
        }

        const chosen = items
          .map((it, i) => ({ name: it.name, price: it.price, qty: cart[i] || 0 }))
          .filter((x) => x.qty > 0);
        const total = chosen.reduce((s, x) => s + x.price * x.qty, 0);

        $("order").disabled = true;
        try {
          const res = await fetch("/api/order", {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({ items: chosen, total, currency, note: null, table: TABLE || null }),
          }).then((x) => x.json());
          if (res.error) throw new Error(res.error);

          $("p-shop").textContent = res.shop || "";
          $("p-rvn").textContent = `${res.quote.rvn} RVN`;
          $("p-fiat").textContent =
            currency === "RVN" ? "" : `${fmt(total)} · 지금 시세로 계산했습니다`;
          $("p-addr").textContent = res.address;
          // 표준 URI. 버튼과 QR 이 같은 것을 가리켜야 한다 — 하나만 고치면
          // 다른 하나가 옛 금액을 들고 있게 된다.
          const uri = `raven:${res.address}?amount=${res.quote.rvn}`;
          $("p-open").href = uri;
          $("p-qrlink").href = uri;
          $("p-qr").innerHTML = qrSvg(uri);
          countdown(res.quote.expires_at);
          watchOrder(res.address);
          paying = true;
          if (KIOSK) {
            // 태블릿에는 지갑이 없다. 손님이 자기 폰으로 QR 을 찍는다.
            $("p-title").textContent = "휴대폰으로 QR을 찍어 결제하세요";
            $("p-open").style.display = "none";
            $("p-openhint").textContent = "가게 화면의 QR을 손님 휴대폰 카메라로 찍으면 지갑이 열립니다.";
          }
          $("paydlg").showModal();
        } catch (e) {
          alert(e.message || e);
        }
        // 주문이 생겼으면 다시 켜지 않는다. 당황한 손님이 한 번 더 누르면
        // /api/order 가 또 나가고 주문이 둘이 된다.
        if (!paying) $("order").disabled = !openState.open;
      };

      // 결제 창을 닫아도 주문은 살아 있다. 닫았다고 주문이 취소되는 것이
      // 아니므로, 다시 주문할 수 있게 하려면 손님이 그렇게 말해야 한다.
      function orderAgain() {
        paying = false;
        $("order").disabled = false;
      }

      // 주문이 어디까지 왔는지. 손님은 이 화면을 열어 두고 기다린다.
      let statePoll, lastState = "", ticket = 0;
      const STATE_KO = {
        // 아직 돈이 안 들어온 상태. 이 줄이 없어서 서버가 곧장 「결제 확인됨」을
        // 답했고, 손님은 결제하기도 전에 확인 화면을 봤다.
        waiting: ["입금을 기다립니다", "결제하시면 이 화면이 저절로 바뀝니다", "wait"],
        // 돈은 왔는데 모자란다. 이 줄이 없으면 손님은 낸 줄 알고 서 있고,
        // 가게는 안 온 줄 알고 안 만든다 — 둘 다 상대를 탓하게 된다.
        short: ["금액이 모자랍니다", "같은 QR로 나머지를 마저 보내 주세요", "worry"],
        // 견적이 지난 뒤에 온 돈. 시세가 움직였을 수 있어 자동으로 확인하지
        // 않는다. 돈은 가게 지갑에 들어와 있으니 "없어졌다" 고 말하면 안 된다.
        expired: ["시간이 지난 뒤 도착했습니다", "돈은 들어왔습니다. 카운터에 보여 주세요", "worry"],
        paid: ["결제 확인됨", "가게가 곧 시작합니다", "happy"],
        making: ["만드는 중", "조금만 기다려 주세요", "wait"],
        ready: ["나왔습니다", "카운터에서 받아 가세요", "happy"],
        done: ["전달됨", "감사합니다", "hello"],
      };

      function watchOrder(address) {
        clearInterval(statePoll);
        // 새 주문이다. 앞 손님의 상태와 번호를 지우지 않으면, 같은 상태로 시작한
        // 두 번째 손님은 "바뀐 게 없다"로 걸러져 번호를 영영 못 본다.
        lastState = "";
        ticket = 0;
        $("p-state").innerHTML = "";
        const tick = async () => {
          try {
            const r = await fetch(`/api/order-state?a=${encodeURIComponent(address)}`).then((x) => x.json());
            if (r.ticket) ticket = r.ticket;
            // 서버가 이 주문을 모른다면 (다시 켜졌거나 오래돼 지워졌다) 아무 말도
            // 하지 않는다. 빈 상자를 그리는 것보다 QR 을 그대로 두는 편이 낫다.
            if (!STATE_KO[r.state]) return;
            if (r.state === lastState) return;
            lastState = r.state;

            const [title, sub, face] = STATE_KO[r.state];
            const isReady = r.state === "ready";
            // 지금 어디쯤인지. 글자 한 줄로는 "다 됐나 아직인가" 를 못 읽는다.
            const STEPS = ["paid", "making", "ready"];
            const at = STEPS.indexOf(r.state);
            const bar = STEPS.map((k, i) => {
              const done = at >= 0 && i <= at;
              return `<div class="stp ${done ? "on" : ""}">
                        <span class="dot"></span>
                        <span class="lb">${["결제", "만드는 중", "나왔어요"][i]}</span>
                      </div>`;
            }).join("");

            $("p-state").innerHTML =
              `<div class="statecard ${isReady ? "ready" : ""}">
                 <img class="face" src="/raven-${face}.webp" alt="" width="132" height="175" />
                 ${ticket ? `<div style="font-size:14px;opacity:.8">주문번호</div>
                             <div class="tk">${ticket}</div>` : ""}
                 <div style="font-size:${isReady ? "21" : "16"}px;font-weight:600;margin-top:4px">${title}</div>
                 <div style="font-size:14px;opacity:.85;margin-top:4px">${sub}</div>
                 ${at >= 0 ? `<div class="steps">${bar}</div>` : ""}
               </div>`;

            // 🔴 손님은 이 화면을 보고 서 있지 않는다. 카톡을 보거나 폰을 넣어
            // 둔다. 소리만으로는 시끄러운 가게에서 못 듣는다 — 다른 앱을 보고
            // 있어도 뜨는 배너가 필요하다.
            //
            // 브라우저를 아예 닫으면 못 받는다. 그건 푸시 서버가 있어야 하고,
            // 가게 컴퓨터에 그걸 두면 우리가 다시 가운데 서게 된다. 여기까지가
            // 서버 없이 되는 최대치다 — 화면이 그렇게 말한다.
            if (isReady && "Notification" in window && Notification.permission === "granted") {
              try {
                new Notification(`${ticket ? ticket + "번 " : ""}나왔습니다`, {
                  body: `${shop.name || "가게"} · 카운터에서 받아 가세요`,
                  icon: "/raven-happy.webp",
                  tag: "playx-order",
                });
              } catch {}
            }

            // 나왔을 때만 소리와 진동. 매 단계 울리면 사람들이 폰을 엎어 둔다.
            if (isReady) {
              try {
                const ac = new (window.AudioContext || window.webkitAudioContext)();
                [0, 0.18].forEach((t) => {
                  const o = ac.createOscillator(), g = ac.createGain();
                  o.connect(g); g.connect(ac.destination);
                  o.frequency.value = 880;
                  g.gain.setValueAtTime(0.001, ac.currentTime + t);
                  g.gain.exponentialRampToValueAtTime(0.3, ac.currentTime + t + 0.02);
                  g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + t + 0.14);
                  o.start(ac.currentTime + t); o.stop(ac.currentTime + t + 0.16);
                });
              } catch {}
              try { navigator.vibrate?.([200, 100, 200]); } catch {}
            }
          } catch {}
        };
        tick();
        statePoll = setInterval(tick, 5000);
      }

      let timer;
      function countdown(expiresAt) {
        clearInterval(timer);
        const tick = () => {
          const left = expiresAt - Math.floor(Date.now() / 1000);
          // 시세가 흔들리면 가게가 받는 금액이 달라진다. 시간이 지나면 다시 받아야 한다.
          $("p-timer").textContent =
            left > 0
              ? `이 금액은 ${Math.floor(left / 60)}분 ${left % 60}초 동안 유효합니다`
              : "시간이 지났습니다. 창을 닫고 다시 주문해 주세요.";
          if (left <= 0) clearInterval(timer);
        };
        tick();
        timer = setInterval(tick, 1000);
      }

      // 닫아도 주문은 살아 있다. 상태 추적을 끊으면 "나왔습니다"가 영영 안
      // 오고, 손님은 카운터에서 자기 커피가 나온 줄 모른 채 서 있게 된다.
      // 시세 타이머만 멈춘다 — 그건 창이 떠 있을 때만 쓸모가 있다.
      $("p-close").onclick = () => {
        clearInterval(timer);
        $("paydlg").close();
        if (KIOSK) kioskReset();
        else orderAgain();
      };

      $("qgo").onclick = async () => {
        const question = $("q").value.trim();
        if (!question) return;
        $("a").className = "answer";
        $("a").textContent = "…";
        try {
          const r = await fetch("/api/ask", {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({ question }),
          }).then((x) => x.json());
          if (r.error) throw new Error(r.error);
          // 답한 것이 누구인지 보이게 한다. 회색 글자만 뜨면 "어디선가 온 글"
          // 이고, 얼굴이 붙으면 이 가게의 Ravi 가 답한 것이 된다.
          $("a").innerHTML =
            `<img class="ansravi" src="/raven-head.webp" alt="" />` +
            `<span class="anstxt"></span>`;
          $("a").querySelector(".anstxt").textContent = r.answer;
        } catch (e) {
          $("a").className = "answer err";
          $("a").textContent = e.message || e;
        }
      };

      // QR은 서버에서 받아온다 — 손님 폰에 라이브러리를 내려받게 하지 않는다.
      function qrSvg(text) {
        return `<img src="/api/qr?text=${encodeURIComponent(text)}" alt="결제 QR" style="width:200px;height:200px;background:#fff;padding:8px;border-radius:10px;display:block;margin:16px auto 8px" />`;
      }

      load();
    </script>
  </body>
</html>
