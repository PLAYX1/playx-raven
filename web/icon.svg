<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- 라비를 **기호로** 줄인 것. 일러스트가 아니다.
       · 옆모습 — 부리가 머리 밖으로 나가야 「새」로 읽힌다
       · 얼굴을 그리지 않는다. 눈 하나만 크게 (20px 에서 유일하게 남는 표시)
       · 색 셋: 바탕 크림 · 머리 남색 · 부리 주황
       · 가는 획·뾰족한 끝 없음. 볏도 굵게 — 얇으면 작을 때 사라진다
       · 주체가 캔버스의 약 80%. 받침대처럼 보이던 목 블록은 뺐다 -->
  <rect width="512" height="512" fill="#faf7f2"/>
  <!-- 볏 — 굵은 두 갈래. 머리에 붙어 있어야 떨어져 보이지 않는다 -->
  <path fill="#232a52" d="
    M196 150 c-34-30-78-58-104-48 -12 5-11 20 1 27 26 16 62 38 88 52 z
    M244 122 c-16-42-42-84-68-88 -13-2-19 10-12 20 16 26 42 58 60 82 z"/>
  <!-- 머리 -->
  <circle cx="232" cy="284" r="148" fill="#232a52"/>
  <!-- 부리 — 크고 하나, 머리 밖으로 확실히 -->
  <path fill="#e7731f" d="M352 236 l138 50 -138 52 c-10 4-19-4-19-14 v-74 c0-10 9-18 19-14 z"/>
  <!-- 눈 — 옆모습이라 하나. 크게 둬야 32px 에서 남는다 -->
  <circle cx="276" cy="252" r="36" fill="#faf7f2"/>
  <circle cx="284" cy="252" r="17" fill="#232a52"/>
</svg>
