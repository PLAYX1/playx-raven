<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- 이 화면만 릴레이로 나간다(물건 목록을 거기서 읽는다). 그래서
         `connect-src` 에 **그 셋만** 적는다 — 어디로든 나갈 수 있으면
         CSP 를 쓰는 뜻이 없다. 12단어는 이 화면에 없지만, 남이 체인에
         올린 가게 이름이 여기 그려지므로 막을 이유는 같다. -->
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'none'; script-src 'self' 'unsafe-inline';
                   style-src 'unsafe-inline'; img-src 'self' data: http: https:;
                   connect-src 'self' wss://relay.damus.io wss://nos.lol
                                wss://relay.primal.net;
                   base-uri 'none'; form-action 'none'; frame-ancestors 'none'" />
    <title>가게 찾기</title>
    <style>
      :root {
        --bg: #ffffff; --fg: #141518; --muted: #6b7280; --line: #e6e7ea;
        --panel: #fafafb; --accent: #3b3f8f; --warn: #b45309; --ravi: #e7731f; --ravi-soft: #8375ae; --ravi-tint: #fdf1e7;
        --safe-b: env(safe-area-inset-bottom, 0px);
      }
      @media (prefers-color-scheme: dark) {
        :root { --bg: #101114; --fg: #eceef2; --muted: #9aa0ab; --line: #26282e;
                --panel: #17191d; --accent: #8d92e8; --warn: #d99b3f;
                --ravi: #f0913f; --ravi-soft: #a294cb; --ravi-tint: #2a1f18; }
      }
      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      body { margin: 0; background: var(--bg); color: var(--fg);
             font: 15px/1.6 -apple-system, BlinkMacSystemFont, system-ui, "Segoe UI", Roboto,
        "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic",
        "Hiragino Sans", "Yu Gothic", "Microsoft YaHei", "PingFang SC",
        "Noto Sans", "Noto Sans Arabic", "Noto Sans Thai", "Noto Sans Devanagari",
        sans-serif;
             padding: 20px 18px calc(24px + var(--safe-b)); }
      h1 { margin: 0 0 4px; font-size: 21px; letter-spacing: -0.02em; }
      .sub { color: var(--muted); font-size: 14px; }
      .search { margin: 16px 0 12px; }
      .search input { width: 100%; padding: 12px 12px; border-radius: 11px;
                      border: 1px solid var(--line); background: var(--panel); color: var(--fg);
                      font-size: 15px; font-family: inherit; }

      .card { display: flex; gap: 12px; align-items: center; padding: 12px 0;
              border-bottom: 1px solid var(--line); text-decoration: none; color: inherit; }
      .card img { width: 56px; height: 56px; object-fit: cover; border-radius: 11px;
                  flex: none; background: var(--panel); }
      .card .ph { width: 56px; height: 56px; border-radius: 11px; flex: none;
                  background: var(--panel); }
      .card .nm { font-weight: 600; font-size: 15px; }
      .card .de { color: var(--muted); font-size: 14px; margin-top: 4px;
                  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .tags { display: flex; gap: 4px; margin-top: 4px; }
      .tag { font-size: 10.5px; padding: 4px 8px; border-radius: 999px;
             border: 1px solid var(--line); color: var(--muted); }
      .empty { color: var(--muted); padding: 40px 0; text-align: center; font-size: 14px;
               line-height: 1.8; }
      /* 지도 앱 고르기. 한 번 고르면 기억한다. */
      /* 🔴 가게 시트(.shopwrap)가 60이다. 여기가 더 낮으면 「길찾기」를
         눌러도 고르는 창이 시트 뒤에 가려 아무 일도 안 일어난 것처럼 보인다. */
      #mapsheet { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: none;
                  align-items: flex-end; justify-content: center; z-index: 80; }
      #mapsheet.on { display: flex; }
      .msbox { background: var(--bg); border-radius: 18px 18px 0 0; width: 100%;
               max-width: 480px; padding: 20px 18px calc(20px + var(--safe-b)); }
      .mshead { font-size: 17px; font-weight: 600; margin-bottom: 12px; }
      .msbtn { display: block; width: 100%; min-height: 56px; margin-bottom: 8px;
               border-radius: 12px; border: 1px solid var(--line); background: var(--panel);
               color: var(--fg); font-size: 17px; font-family: inherit; cursor: pointer; }
      .msbtn span { display: block; font-size: 14px; color: var(--muted); margin-top: 4px; }
      .msbtn.cancel { background: transparent; border-color: transparent; color: var(--muted);
                      font-size: 15px; min-height: 48px; }
      .mschk { display: flex; align-items: center; gap: 8px; padding: 12px 4px;
               font-size: 15px; }
      .mschk input { width: 22px; height: 22px; }
      .foot { margin-top: 20px; font-size: 13.5px; color: var(--muted); line-height: 1.8; }
          /* 목록에서 가장 큰 동작. 가게를 찾은 다음에 할 일은 주문뿐이다. */
      .orderbtn { display: inline-block; margin-top: 8px; margin-right: 8px;
                  padding: 8px 16px; border-radius: 8px; background: var(--fg);
                  color: var(--bg); font-size: 14px; font-weight: 600;
                  text-decoration: none; }

      /* 되돌아가는 길. 60x18 이라 손가락보다 작았다 — 나가지 못하는 화면은
         쉬운 화면이 아니다. */
      .back { display: inline-flex; align-items: center; min-height: 44px;
        padding: 0 12px 0 0; font-size: 15px; text-decoration: none;
        /* 기본 파란 링크로 두면 이 화면에서 가장 눈에 띄는 것이 "나가기" 가
           된다. 돌아가는 길은 있되 주인공은 아니다. */
        color: var(--muted); }
      @media (hover: hover) { .back:hover { color: var(--ravi); } }
      /* 지금 어느 탭인지 보이지 않으면 두 번 누른다. */
      .tb.on { background: var(--ravi); border-color: var(--ravi);
        color: #fff; font-weight: 600; }
      /* 「가게 / 물건」 을 가르는 탭. 39x22 라 손가락 절반이었다. */
      .tb { min-height: 44px; padding: 0 16px; font-size: 15px; }

      /* 가게 자세히. 손님이 목록에서 하나를 눌렀을 때 여는 것. */
      .shopwrap { position: fixed; inset: 0; background: rgba(0,0,0,.45);
                  display: none; align-items: flex-end; z-index: 60; }
      .shopwrap.on { display: flex; }
      .shopsheet { background: var(--bg); width: 100%; max-height: 86vh; overflow-y: auto;
                   border-radius: 18px 18px 0 0;
                   padding: 20px 18px calc(18px + var(--safe-b)); }
      .shoptitle { font-size: 21px; font-weight: 700; }
      .shopsub { color: var(--muted); font-size: 14.5px; margin-top: 4px; line-height: 1.6; }
      .shoprow { display: flex; gap: 10px; padding: 12px 0;
                 border-bottom: 1px solid var(--line); font-size: 15px; }
      .shoprow b { flex: none; width: 92px; color: var(--muted); font-weight: 500; }
      /* 전화는 눌러서 걸려야 한다. 어르신이 번호를 외워 옮겨 적지 않는다. */
      .shoprow a { color: var(--ravi); text-decoration: none; }
      .shopno { margin-top: 14px; width: 100%; min-height: 52px; font-size: 16px;
                background: transparent; border: 1px solid var(--line);
                color: var(--muted); border-radius: 12px; font-family: inherit; }
      .ravibox { text-align: center; padding: 32px 16px; }
      .ravibox img { width: 180px; height: auto; border-radius: 16px;
        animation: ravifloat 3.6s ease-in-out infinite; }
      .ravibox .rt { margin-top: 12px; font-size: 16px; font-weight: 600; }
      .ravibox .rs { margin-top: 4px; font-size: 14px; color: var(--muted); line-height: 1.6; }
      @keyframes ravifloat { 0%,100% { transform: none; } 50% { transform: translateY(-6px); } }
      @media (prefers-reduced-motion: reduce) { .ravibox img { animation: none; } }

      /* ── 손맛 ────────────────────────────────────────────────────────────
         "즐거운 인터랙션" 은 화려한 애니메이션이 아니라 **누른 것이 눌린 것처럼
         반응하는 것**이다. 아이폰이 처음에 준 느낌이 그거였다.
         전부 CSS 로만 한다 — 이 화면들의 조건은 외부 스크립트 0개다. */

      /* 누르면 실제로 들어간다. 60~90ms 는 "반응이 즉시"로 느껴지는 구간이고,
         이보다 길면 굼떠 보이고 짧으면 안 보인다. */
      button, .btn, a.btn {
        transition: transform .08s ease, box-shadow .16s ease, background .16s ease,
                    border-color .16s ease;
      }
      button:active, .btn:active { transform: scale(.965); }

      /* 손가락이 닿기 전에 먼저 반응한다(마우스가 있는 기기에서만). */
      @media (hover: hover) {
        button:hover:not(:disabled) { border-color: var(--ravi); }
      }

      /* 눌렀을 때 그 자리에서 번지는 빛. ::after 하나로 끝난다. */
      button { position: relative; overflow: hidden; }
      button::after {
        content: ""; position: absolute; inset: 0; border-radius: inherit;
        background: radial-gradient(circle at center, var(--ravi) 0%, transparent 62%);
        opacity: 0; transform: scale(.2); pointer-events: none;
      }
      button:active::after { animation: tap .42s ease-out; }
      @keyframes tap {
        0%   { opacity: .30; transform: scale(.2); }
        100% { opacity: 0;   transform: scale(1.7); }
      }

      /* 값이 바뀐 자리를 눈이 따라가게. 숫자가 조용히 갈리면 못 본다. */
      .pop { animation: pop .34s cubic-bezier(.34,1.56,.64,1); }
      @keyframes pop {
        0% { transform: scale(1); } 45% { transform: scale(1.14); } 100% { transform: scale(1); }
      }

      /* 기다리는 자리. 회색 상자가 가만히 있으면 고장으로 읽힌다. */
      .shimmer { background: linear-gradient(90deg,
        var(--panel) 25%, var(--line) 37%, var(--panel) 63%);
        background-size: 400% 100%; animation: shim 1.4s linear infinite; }
      @keyframes shim { 0% { background-position: 100% 0; } 100% { background-position: 0 0; } }

      /* 새로 들어온 줄은 아래에서 올라온다. 튀어나오면 놀라고, 스며들면 놓친다. */
      .risein { animation: risein .28s ease-out both; }
      @keyframes risein {
        from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; }
      }

      /* 움직임을 줄이는 설정을 켠 사람에게는 전부 멈춘다. 멀미는 취향이 아니다. */
      @media (prefers-reduced-motion: reduce) {
        button, .btn, a.btn { transition: none; }
        button:active, .btn:active { transform: none; }
        button:active::after, .pop, .shimmer, .risein { animation: none; }
      }
      /* 나이 배지. 값이 오기 전에는 자리를 잡지 않는다 — 빈 회색 알약이
         떠 있으면 "안 불러와졌다"로 읽힌다. */
      .tag.age { display: none; }
      .tag.age.shown { display: inline-block; border-color: var(--ravi); color: var(--ravi); }
      /* 개인이 파는 자리. 가게 등록(500 RVN)과 달리 공짜라, 그 사실이
         버튼 옆에 있어야 눌린다. */
      .sellcta { display: block; text-align: center; margin: 0 0 16px;
        min-height: 48px; line-height: 48px; border-radius: 12px;
        background: var(--ravi); color: #fff; font-weight: 600;
        text-decoration: none; font-size: 16px; }
      .sellcta::after { content: " · 공짜"; font-weight: 400; opacity: .85; font-size: 14px; }
      /* ── 물건 카드 ────────────────────────────────────────────────────
         🔴 `.icard` 는 shops.src.ts 가 쓰는데 **CSS 가 아예 없었다.**
         그래서 남이 올린 사진이 원본 크기 그대로 나와 화면을 통째로 덮었다.
         가게 카드(.card)와 같은 규칙을 주되, 물건은 사진이 주인공이라
         조금 크게(74px) 잡는다. 남이 올린 값이 우리 레이아웃을 정하게
         두면 안 된다 — 그건 크기만 다른 XSS 다. */
      .icard {
        display: flex; gap: 12px; align-items: flex-start; padding: 12px 0;
        border-bottom: 1px solid var(--line); cursor: pointer;
        transition: background .16s ease;
      }
      .icard:last-child { border-bottom: 0; }
      @media (hover: hover) { .icard:hover { background: var(--panel); } }
      .icard:active { background: var(--panel); }
      .icard img {
        width: 74px; height: 74px; flex: none;
        object-fit: cover; border-radius: 12px; background: var(--panel);
      }
      .icard .nm { font-weight: 600; font-size: 16px; line-height: 1.35;
        display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
        overflow: hidden; }
      .icard .pr { margin-top: 2px; font-size: 16px; font-weight: 600; color: var(--ravi); }
      .icard .de {
        margin-top: 4px; color: var(--muted); font-size: 14px; line-height: 1.5;
        display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .icard .tags { margin-top: 6px; display: flex; flex-wrap: wrap; gap: 6px; }
      /* 자세히 보기 안의 사진도 같은 이유로 묶는다. */
      #sheet img, .sheet img { max-width: 100%; height: auto; border-radius: 12px; }
      /* ── 아래 탭 ─────────────────────────────────────────────────────────
         🔴 지갑과 가게 목록을 **한 페이지로 합치지 않았다.** 지갑은
         `connect-src 'self'` 이고 가게 목록은 릴레이로 나가야 한다. 합치면
         12단어가 있는 페이지에 바깥 통로가 생긴다 — 그 방어선이 이 지갑에서
         제일 중요하다.

         대신 **같은 바를 양쪽에 둔다.** 누르면 페이지가 바뀌지만 가게
         와이파이에서는 눈에 안 띄고, 늘 같은 자리에 같은 세 칸이 있으면
         사람은 그것을 한 앱으로 읽는다. */
      .tabbar {
        position: fixed; left: 0; right: 0; bottom: 0; z-index: 50;
        display: flex; background: var(--bg);
        border-top: 1px solid var(--line);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      .tabbar a {
        flex: 1; min-height: 56px; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 2px;
        text-decoration: none; color: var(--muted); font-size: 12.5px;
        -webkit-tap-highlight-color: transparent;
      }
      .tabbar a.on { color: var(--ravi); font-weight: 600; }
      .tabbar a svg { width: 22px; height: 22px; }
      /* 바가 본문 끝을 가리지 않게. 고정 바는 늘 이 짝이 필요하다. */
      body { padding-bottom: calc(64px + env(safe-area-inset-bottom, 0px)); }
      /* ── 물건 자세히 ─────────────────────────────────────────────────
         🔴 이 규칙이 통째로 없었다. `openItem` 이 `display:""` 로 켜기는
         하는데 배치가 없어서 **목록 30개 밑에 조용히 그려졌다** — 사장은
         "눌러도 아무 일이 안 난다" 고 겪는다. 실제로 그렇게 보였다.

         화면을 갈아 끼우지 않고 아래에서 올라오는 판으로 연다. 목록에서
         자기가 어디를 보고 있었는지 잃지 않는다. */
      #sheet {
        position: fixed; inset: 0; z-index: 100;
        background: rgba(0, 0, 0, .38);
        display: flex; align-items: flex-end; justify-content: center;
        -webkit-backdrop-filter: blur(2px); backdrop-filter: blur(2px);
      }
      .sheetin {
        width: 100%; max-width: 560px; max-height: 86vh; overflow-y: auto;
        background: var(--bg); color: var(--fg);
        border-radius: 20px 20px 0 0;
        padding: 20px 18px calc(24px + env(safe-area-inset-bottom, 0px));
        animation: sheetup .26s cubic-bezier(.2, .9, .3, 1) both;
      }
      @keyframes sheetup { from { transform: translateY(24px); opacity: .6; } to { transform: none; opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { .sheetin { animation: none; } }
      /* 닫기는 오른쪽 위. 44px 이상이어야 손가락으로 닫힌다. */
      .sheetx {
        float: right; min-height: 44px; padding: 0 14px; font-size: 15px;
        border: 1px solid var(--line); border-radius: 10px;
        background: none; color: var(--muted); cursor: pointer;
      }
      /* Ravi 를 부르는 자리. 탭 바 위에 뜬다. */
      .raviask { position: fixed; right: 14px; z-index: 60;
        bottom: calc(74px + env(safe-area-inset-bottom, 0px));
        display: flex; align-items: center; gap: 8px;
        padding: 7px 15px 7px 7px; border-radius: 999px;
        border: 1px solid var(--line); background: var(--bg);
        box-shadow: 0 4px 16px rgba(0,0,0,.14);
        font-size: 14px; font-weight: 600; color: var(--fg);
        min-height: 48px; cursor: pointer; }
      .raviask img { width: 32px; height: 32px; border-radius: 999px; }
      .ravisheet .qa { margin-top: 12px; }
      .ravisheet input { width: 100%; min-height: 48px; padding: 0 14px;
        border: 1px solid var(--line); border-radius: 12px; background: var(--bg);
        color: var(--fg); font: inherit; font-size: 16px; }
      /* 라비 얼굴과 답을 나란히. ⚠️ `flex-wrap: wrap` 이 필요하다 —
         열쇠칸이 이 안에 붙는데, 안 감싸면 얼굴과 **같은 줄**에 서려다가
         폭 100% 가 얼굴 몫만큼 넘쳐서 화면 밖으로 나간다. */
      .ravisheet .ans { margin-top: 12px; font-size: 15px; line-height: 1.75;
        white-space: pre-wrap; display: flex; flex-wrap: wrap; gap: 8px;
        align-items: flex-start; }
      .ravisheet .ans img { width: 28px; height: 28px; border-radius: 9px; flex: none; }
      /* 손님이 자기 AI 열쇠를 넣는 칸. 평소엔 없다 — 한도가 찼을 때만 나온다. */
      /* 🔴 이 칸은 답변 칸(`#ravi-a`, `.ans`) **안에** 붙는다. 그 칸은
         AI 답의 줄바꿈을 살리려고 `white-space: pre-wrap` 이고 `display:flex`
         다. 그래서 이 칸을 넣으면 두 가지가 한꺼번에 일어났다:
           ① 소스의 줄바꿈·들여쓰기가 **화면에 그대로 그려진다.**
              제목이 안쪽으로 밀리고, 태그 사이마다 빈 줄이 생겼다 —
              대표님이 보신 "위아래가 텅 빈" 화면이 그것이다.
           ② flex 자식이라 폭·높이가 제 뜻대로 안 잡힌다.
         답변 글에는 pre-wrap 이 맞다. 그러니 **이 칸만** 되돌린다. */
      .keybox { margin-top: 14px; padding: 14px; border-radius: 14px;
        border: 1px solid var(--line); background: var(--panel);
        white-space: normal; width: 100%; flex: none; }
      /* 안쪽 글도 마찬가지다. 자식이 pre-wrap 을 물려받으면 같은 일이 난다. */
      .keybox * { white-space: normal; }
      /* 다만 열쇠 앞글자(`xai-…`)는 붙여 써야 읽힌다. */
      .keybox code, .keybox .wg { white-space: nowrap; }
      .keybox .btn { display: flex; align-items: center; justify-content: center;
        min-height: 48px; border-radius: 12px; border: 1px solid var(--line);
        background: var(--bg); color: var(--fg); text-decoration: none;
        font-size: 15px; font-weight: 600; }
      /* 🔴 16px 미만이면 아이폰 사파리가 탭할 때마다 화면을 확대한다. */
      .keybox input { width: 100%; min-height: 48px; margin-top: 8px; padding: 0 12px;
        font-size: 16px; border: 1px solid var(--line); border-radius: 12px;
        background: var(--bg); color: var(--fg); }
      /* 파는 사람에게 거는 자리. 이 화면에서 제일 중요한 단추라
         제일 크다 — 여기가 없으면 장터가 아니라 게시판이다. */
      .contact { margin-top: 18px; display: grid; gap: 10px; }
      .cbtn { display: flex; align-items: center; justify-content: center;
        min-height: 56px; border-radius: 14px; font-size: 17px; font-weight: 600;
        text-decoration: none; border: 1px solid var(--line);
        background: var(--panel); color: var(--fg); }
      .cbtn.call { background: var(--ravi); border-color: var(--ravi); color: #fff; }
      /* 「이 물건 사기」가 이 화면의 주인공이다. 전화보다 위, 더 크게. */
      .cbtn.buy { flex-direction: column; gap: 2px; min-height: 64px;
        background: var(--accent); border-color: var(--accent); color: #fff; }
      .cbtn .sub2 { font-size: 13px; font-weight: 400; opacity: .85; }
      /* 자는 라비. 눌러도 열린다 — 거기서 열쇠를 넣으면 그 자리에서 깨어난다. */
      .raviask.asleep img { filter: saturate(.5) opacity(.8); }
      .raviask.asleep { opacity: .92; }
      /* 열쇠 링크. 평소엔 작게 — 안 넣어도 되니까. 다만 **늘 보인다.** */
      #ravi-mykey { color: var(--ravi); font-weight: 600; text-decoration: none;
        display: inline-block; min-height: 44px; line-height: 44px; }
      .wakeline { padding: 10px 12px; border-radius: 12px; background: var(--ravi-tint);
        color: var(--fg); font-size: 15px; margin-bottom: 10px; }
      .keybox .btn.go { background: var(--ravi); border-color: var(--ravi); color: #fff; }
      /* 어디서 열쇠를 받나. 다섯 줄이라 표로 두면 눈이 훑는다. */
      .wherelist { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
      .wrow { display: grid; grid-template-columns: 1fr auto auto; gap: 10px;
        align-items: center; padding: 0 12px; min-height: 52px;
        border-bottom: 1px solid var(--line); text-decoration: none; color: var(--fg); }
      .wrow:last-child { border-bottom: 0; }
      .wn { font-size: 15px; font-weight: 600; }
      .wp code { font-size: 13px; color: var(--muted); }
      .wg { font-size: 14px; color: var(--ravi); font-weight: 600; white-space: nowrap; }
      /* 답할 말. 작게 두되 늘 보인다 — 외국 손님이 못 찾으면 없는 것과 같다. */
      .langpick { display: flex; align-items: center; gap: 8px; margin: 10px 0 6px; }
      .langpick select { min-height: 44px; font-size: 15px; padding: 0 8px;
        border: 1px solid var(--line); border-radius: 10px;
        background: var(--bg); color: var(--fg); }
      /* 🔴 44px 미만은 손가락으로 못 누른다. 이 둘이 39px 이었다 —
         「묻기」는 이 시트에서 제일 많이 눌리는 단추다. */
      #ravi-go, #ravi-key-save { min-height: 48px; font-size: 16px; }
      /* 찾기·찜. 물건 탭 맨 위 — 목록을 훑기 전에 좁힐 수 있어야 한다. */
      .itembar { display: flex; gap: 8px; margin-bottom: 12px; }
      /* 🔴 16px 미만이면 아이폰 사파리가 탭할 때마다 화면을 확대한다. */
      .itembar input { flex: 1; min-width: 0; min-height: 48px; font-size: 16px;
        padding: 0 12px; border: 1px solid var(--line); border-radius: 12px;
        background: var(--bg); color: var(--fg); }
      .itembar button { flex: none; min-height: 48px; padding: 0 16px; font-size: 16px; }
      .itembar button[aria-pressed="true"] { background: var(--ravi);
        border-color: var(--ravi); color: #fff; }
      /* 하트. 카드 오른쪽 위에 띄운다 — 카드 안에 두면 물건을 열려다 눌린다. */
      .icard { position: relative; }
      .fav { position: absolute; top: 6px; right: 6px; width: 44px; height: 44px;
        border: 0; background: transparent; font-size: 22px; line-height: 1;
        color: var(--muted); cursor: pointer; }
      .fav.on { color: var(--ravi); }
</style>
    <script src="/i18n.js"></script>
    <script src="/ravi.js"></script>
      <!-- 카톡·텔레그램에 링크를 붙였을 때 뜨는 카드.
         ⚠️ 매장 노드는 자기 주소(192.168.x)라 바깥에서 그림을 못 가져온다.
            그래서 그림은 **웹 주소**를 가리킨다 — 가게 안이든 밖이든 뜬다. -->
    <link rel="icon" href="/faces/raven-head.webp" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="가게와 물건 찾기" />
    <meta property="og:description" content="블록체인에서 직접 읽어 옵니다." />
    <meta property="og:image" content="https://rvn.ex.erci.se/og-raven.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <!-- 들어올 문만 만들고 나갈 문을 안 만들었다. 폰에 뒤로가기가 있지만,
         지갑에서 링크로 온 사람은 그걸 누를 생각을 안 한다. -->
    <h1 id="pagetitle">가게 찾기</h1>

    <!-- 가게는 체인에, 물건은 릴레이에 있다. 손님에게는 둘 다 "여기서 살 수
         있는 것" 이라 나누는 것은 우리 사정이지 손님 사정이 아니다. -->
    <div class="tabs" style="display:flex;gap:8px;margin:0 0 12px">
      <button class="tb on" data-tab="shops">가게</button>
      <button class="tb" data-tab="items">물건</button>
    </div>
    <div class="sub" id="count">불러오는 중…</div>

    <div class="search"><input id="q" placeholder="가게 이름" autocomplete="off" /></div>
    <div class="row" style="display:flex;gap:8px;margin-bottom:12px">
      <button id="near" style="flex:1;padding:12px;border-radius:10px;border:1px solid var(--line);
              background:var(--panel);color:var(--fg);font-size:14px;font-family:inherit">
        가까운 순으로
      </button>
    </div>
    <div class="sub" id="locnote" style="margin-bottom:8px"></div>
    <div id="list"><div class="empty">체인에서 읽는 중…</div></div>
    <!-- 🔴 물건 탭에서만 쓰는 줄. 가게 탭에는 이미 「가게 이름」 칸이 있다. -->
    <div class="itembar" id="itembar" style="display:none">
      <input id="iq" type="search" placeholder="무엇을 찾으세요?" autocomplete="off" />
      <button id="favonly" class="ghost" aria-pressed="false">♡ 찜</button>
    </div>

    <a class="btn sellcta" id="sellcta" href="/wallet#sell" style="display:none">내 물건 올리기</a>
    <div id="items" style="display:none"><div class="empty">불러오는 중…</div></div>
    <div id="sheet" style="display:none"></div>

    <p class="foot">
      <b>가게 정보는 각 가게가 직접 올린 것입니다. 아무도 검사하지 않습니다</b> —
      처음 보는 가게에 큰 돈을 보내기 전에 확인하세요.<br />
      이 목록을 가진 회사는 없습니다. 블록체인에서 그때그때 읽어 옵니다.
    </p>

    <script>
      const $ = (id) => document.getElementById(id);

      // 🔴 이 목록의 글자는 **남이 체인에 올린 것**이다. 아무나 SHOP.무엇을
      // 발행할 수 있고(500 RVN), 그 이름·설명이 여기 그려진다. 그대로 넣으면
      // 남이 넣은 <script> 가 이 목록을 여는 **모든 손님의 브라우저에서**
      // 돈다 — 지갑을 열어 둔 손님이면 12단어가 위험하다.
      //
      // 탈중앙이라 등록을 막을 수 없다. 막을 수 있는 것은 **그리는 방식**뿐이다.
      // 주소도 남이 정한다. javascript: 같은 것이 들어오면 그건 우리가
      // 뿌리는 공격이 된다. http/https 만 통과시킨다.
      const safeUrl = (u) => (/^https?:\/\//i.test(String(u || "")) ? String(u) : "");
      const esc = (v) => String(v ?? "")
        .replace(/&/g, "&amp;").replace(/</g, "&lt;")
        .replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
      let all = [], me = null;

      // 직선거리. 걸어가는 거리가 아니다 — 강 건너 200m 는 20분이고, 그걸
      // 숨긴 숫자는 없는 숫자보다 나쁘다. 그래서 화면에도 "직선"이라 쓴다.
      function haversine(a, b) {
        const R = 6371000, rad = (d) => (d * Math.PI) / 180;
        const dp = rad(b.lat - a.lat), dl = rad(b.lon - a.lon);
        const x =
          Math.sin(dp / 2) ** 2 +
          Math.cos(rad(a.lat)) * Math.cos(rad(b.lat)) * Math.sin(dl / 2) ** 2;
        return 2 * R * Math.asin(Math.sqrt(x));
      }

      const fmtDist = (m) =>
        m < 1000 ? `직선 ${Math.round(m / 10) * 10}m` : `직선 ${(m / 1000).toFixed(1)}km`;

      $("near").onclick = () => {
        if (!navigator.geolocation) {
          $("locnote").textContent = "이 브라우저는 위치를 지원하지 않습니다.";
          return;
        }
        // http://192.168.x 에서는 브라우저가 위치를 안 준다. 가짜 좌표를 넣지
        // 않고, 왜 안 되는지 그대로 말한다.
        if (!window.isSecureContext) {
          $("locnote").innerHTML =
            "이 주소(<code>http</code>)에서는 브라우저가 위치를 주지 않습니다. " +
            "가게가 <b>바깥 주소</b>를 켜면 됩니다.";
          return;
        }
        $("locnote").textContent = "위치를 읽는 중…";
        navigator.geolocation.getCurrentPosition(
          (p) => {
            me = { lat: p.coords.latitude, lon: p.coords.longitude };
            all.forEach((s) => {
              if (s.profile?.lat != null) s.dist = haversine(me, s.profile);
            });
            $("locnote").textContent = "가까운 순으로 보여드립니다.";
            render();
          },
          () => { $("locnote").textContent = "위치를 받지 못했습니다."; },
          { timeout: 10000 }
        );
      };

      // 매장 노드 판과 다른 점은 여기 하나다. 이쪽은 프로필까지 **서버가 미리
      // 붙여** 평평한 한 덩어리로 준다 — 손님 폰이 가게 수만큼 IPFS 를 두드리면
      // 목록 하나 여는 데 몇 초가 걸리고, 지하철에서는 아예 안 열린다.
      //
      // 명부를 우리가 들고 있는 것은 아니다. 같은 질문을 다른 노드에 해도 같은
      // 답이 나오고, 우리가 문을 닫아도 가게는 체인에 남는다. 이 경로는 그 답을
      // 빠르게 전해 주는 통로지 명부 자체가 아니다.
      async function load() {
        try {
          const r = await fetch("/api/chain/shops", { cache: "no-store" }).then((x) => x.json());
          if (r.error) throw new Error(r.error);
          all = (r.shops || []).map((s) => ({
            asset: s.asset,
            profile: {
              name: s.title,
              desc: s.description,
              icon: s.icon,
              location: s.location,
              lat: s.lat,
              lon: s.lon,
              // 프로필을 못 읽은 가게도 목록에 남긴다. 조용히 빼면 가게가
              // 사라진 것처럼 보이고, 사장은 자기 가게가 왜 없는지 못 찾는다.
              offline: s.offline,
              // 🔴 체인이 보증하는 공개키로 대조했는가. 릴레이에서만 읽은
              //    것은 이름표만 보고 믿은 것이라 그렇게 적어야 한다.
              verified: s.verified,
              menu_count: s.menu_count,
              order_url: s.order_url,
              // 체인의 주문 주소는 안 바뀌는 가게(자기 도메인)만 적는다.
              // 대개는 비어 있고, 지금 주소는 이 열쇠로 릴레이에서 찾는다.
              nostr_pubkey: s.nostr_pubkey,
            },
          }));
          if (me) {
            for (const s of all) {
              if (s.profile.lat != null) s.dist = haversine(me, s.profile);
            }
          }
          $("count").textContent = `${all.length}곳`;
          render();
          fillAges();
          // 릴레이는 몇 초 걸린다. 기다렸다 목록을 그리면 화면이 그동안 비어
          // 있고, 그 사이 손님은 「장사 안 한다」고 읽고 나간다.
          fillLive();
        } catch (e) {
          // "Unexpected token '<'" 를 그대로 보여 주지 않는다. 사람이 할 수
          // 있는 일이 하나도 없는 문장이다.
          $("list").innerHTML =
            `<div class="empty">가게 목록을 불러오지 못했습니다.<br />` +
            `잠시 뒤에 다시 열어 주세요.</div>`;
        }
      }

      function render() {
        const q = $("q").value.trim().toLowerCase();
        let rows = all.filter((s) => {
          if (!q) return true;
          const hay = `${s.asset} ${s.profile?.name || ""}`.toLowerCase();
          return hay.includes(q);
        });
        // 좌표가 없는 가게를 0m 로 두면 맨 위에 올라온다. 뒤로 보낸다.
        if (me) rows = rows.sort((a, b) => (a.dist ?? Infinity) - (b.dist ?? Infinity));

        $("list").innerHTML = rows.length
          ? rows
              .map((s) => {
                const p = s.profile || {};
                const label = s.asset.replace(/^SHOP\./, "");
                // 🔴 여태 `href="#"` 이었다 — **누르면 아무 일도 안 일어난다.**
                // 손님이 가게를 찾은 다음에 할 일이 「주문」밖에 없는데,
                // 그 버튼은 문을 연 가게에만 생긴다. 닫힌 가게를 누른 손님은
                // 화면이 죽은 줄 안다.
                //
                // 이제 누르면 그 가게의 자세한 것이 열린다 — 전화·위치·
                // 영업시간·길찾기. 닫혀 있어도 「몇 시에 여는지」는 알아야 한다.
                return `<a class="card" href="#" data-open="${esc(s.asset)}">
                  ${safeUrl(p.icon) ? `<img src="${esc(safeUrl(p.icon))}" alt="" loading="lazy" />` : `<div class="ph"></div>`}
                  <div style="min-width:0">
                    <div class="nm">${esc(p.name || label)}</div>
                    <div class="de">${esc(p.desc || p.location || label)}</div>
                    <div class="tags">
                      ${s.dist != null ? `<span class="tag">${fmtDist(s.dist)}</span>` : ""}
                      <span class="tag age" data-age="${esc(s.asset)}"></span>
                      ${p.menu_count ? `<span class="tag">메뉴 ${p.menu_count}가지</span>` : ""}
                      ${
                        // 이름은 아무나 1,700원이면 선점한다. 손님이 판단할
                        // 근거를 준다 — 순위만 바꾸고 이유를 감추면 우리가
                        // 대신 판단해 주는 것이고, 그럼 우리가 심사 기관이 된다.
                        p.offline
                          ? `<span class="tag warn">정보를 못 읽었습니다</span>`
                          : p.verified === false
                          ? `<span class="tag warn">확인 못 함</span>`
                          : (!p.desc && p.lat == null && !p.menu_count
                              ? `<span class="tag warn">이름만 등록됨</span>`
                              : "")
                      }
                    </div>
                    ${
                      p.order_url
                        ? `<a class="orderbtn" href="${esc(safeUrl(p.order_url))}" target="_blank" rel="noopener noreferrer">주문하러 가기</a>`
                        // 체인에 주소가 없어도 가게가 지금 문을 열어 뒀을 수
                        // 있다. 릴레이에 물어 보고 답이 오면 그때 버튼이 뜬다.
                        // 답을 기다리는 동안 빈 자리를 두지 않는다 — 빈 자리는
                        // 「이 가게는 주문을 안 받는다」로 읽힌다.
                        : p.nostr_pubkey
                          ? `<div class="livespot" data-live="${esc(s.asset)}"
                                  data-pk="${esc(p.nostr_pubkey)}"
                                  style="margin-top:8px;font-size:14px;color:var(--dim)">지금 여는지 확인 중…</div>`
                          : ""
                    }
                    ${
                      p.lat != null
                        ? `<button data-go="${p.lat},${p.lon}" data-nm="${esc(p.name || "")}"
                             style="margin-top:8px;padding:8px 12px;border-radius:8px;
                             border:1px solid var(--line);background:var(--bg);color:var(--fg);
                             font-size:15px;font-family:inherit">길찾기</button>`
                        : ""
                    }
                  </div>
                </a>`;
              })
              .join("")
          : all.length
            ? `<div class="ravibox">
                 <img src="/raven-wait.webp" alt="" />
                 <div class="rt">찾는 가게가 없습니다</div>
                 <div class="rs">다른 말로 찾아보시거나, 아래 목록을 그냥 둘러보세요.</div>
               </div>`
            : `<div class="ravibox">
                 <img src="/raven-hello.webp" alt="" />
                 <div class="rt">이 동네의 첫 가게를 찾고 있습니다</div>
                 <div class="rs">아직 아무도 없습니다. 지금 여시면 <b>1호</b>가 됩니다.<br />
                   레이븐코인을 받는 가게라면 누구나 올릴 수 있어요.</div>
               </div>`;
        // 다시 그릴 때마다 「지금 여는지」 자리가 새로 생긴다. 채워 주지 않으면
        // 찾기 칸에 한 글자만 쳐도 열려 있던 가게의 주문 버튼이 사라진다.
        // 릴레이에 다시 묻지는 않는다 — 위의 `LIVE_CACHE` 가 막는다.
        fillLive();
      }

      /* 가게 하나를 자세히 연다.
       *
       * 여는 값은 **이미 목록에 있는 것**만 쓴다. 여기서 다시 불러오면
       * 손님이 누르고 몇 초를 기다리고, 그 사이 빈 시트를 본다.
       */
      function openShop(asset) {
        const row = all.find((s) => s.asset === asset);
        if (!row) return;
        const p = row.profile || {};
        const label = asset.replace(/^SHOP\./, "");
        $("sh-name").textContent = p.name || label;
        $("sh-sub").textContent = p.desc || "";

        const line = (k, v) => (v ? `<div class="shoprow"><b>${k}</b><span>${v}</span></div>` : "");
        const tel = p.phone
          ? `<div class="shoprow"><b>전화</b><a href="tel:${esc(String(p.phone).replace(/[^0-9+]/g, ""))}">${esc(p.phone)}</a></div>`
          : "";
        $("sh-rows").innerHTML =
          line("이름", esc(p.name || label)) +
          line("주소", esc(p.location || "")) +
          tel +
          line("체인 이름", esc(asset)) +
          (row.dist != null ? line("거리", fmtDist(row.dist)) : "") +
          // 🔴 정보를 못 읽은 가게에는 그렇게 적는다. 빈 시트는 고장으로 읽힌다.
          (p.offline
            ? `<div class="shoprow"><b>알림</b><span>가게가 올린 정보를 아직 못 읽었습니다.
                 가게 컴퓨터가 꺼져 있을 수 있습니다.</span></div>`
            : "");

        // 할 수 있는 일. 주문은 문 연 가게에만, 길찾기는 좌표 있는 가게에만.
        const live = LIVE_CACHE[asset];
        const acts = [];
        if (live && live.url)
          acts.push(`<a class="orderbtn" href="${esc(safeUrl(live.url))}" target="_blank"
                        rel="noopener noreferrer">주문하러 가기</a>`);
        else if (p.order_url)
          acts.push(`<a class="orderbtn" href="${esc(safeUrl(p.order_url))}" target="_blank"
                        rel="noopener noreferrer">주문하러 가기</a>`);
        if (p.lat != null)
          acts.push(`<button data-go="${p.lat},${p.lon}" data-nm="${esc(p.name || label)}"
                       style="margin-top:8px;padding:10px 14px;border-radius:10px;
                       border:1px solid var(--line);background:var(--bg);color:var(--fg);
                       font-size:15px;font-family:inherit">길찾기</button>`);
        $("sh-acts").innerHTML =
          acts.join(" ") ||
          `<div class="empty" style="padding:18px 0">지금은 주문을 받지 않습니다.</div>`;
        // 길찾기 단추는 문서 전체에 걸린 처리기가 받는다(아래 `data-go`).
        // 여기서 따로 묶지 않는다 — 두 번 걸면 두 번 열린다.
        $("shopwrap").classList.add("on");
      }

      // ── 언제부터 있는 가게인가 ────────────────────────────────────────
      //
      // 별점도 온도도 만들지 않는다. 별점은 살 수 있고, 온도를 계산하려면
      // 우리가 서버가 되어야 한다. 대신 체인에 남아 **위조할 수 없는 것**을
      // 말한다 — 이름은 1,700원이면 선점하지만 2년 된 이력은 못 산다.
      const AGE_CACHE = {};

      function ago(sec) {
        const d = Math.floor((Date.now() / 1000 - sec) / 86400);
        if (d < 1) return "오늘 생김";
        if (d < 30) return `${d}일째`;
        if (d < 365) return `${Math.floor(d / 30)}개월째`;
        const y = Math.floor(d / 365);
        const m = Math.floor((d % 365) / 30);
        return m ? `${y}년 ${m}개월째` : `${y}년째`;
      }

      async function fillAges() {
        const spots = [...document.querySelectorAll("[data-age]")];
        for (const el of spots) {
          const a = el.dataset.age;
          if (AGE_CACHE[a] !== undefined) { paintAge(el, AGE_CACHE[a]); continue; }
          try {
            const r = await fetch(`/api/shop-history?a=${encodeURIComponent(a)}`)
              .then((x) => x.json());
            AGE_CACHE[a] = r?.since || null;
          } catch { AGE_CACHE[a] = null; }
          paintAge(el, AGE_CACHE[a]);
        }
      }

      function paintAge(el, since) {
        if (!since) { el.remove(); return; }   // 모르면 비워 두지 말고 없앤다
        el.textContent = ago(since);
        el.classList.add("shown");
      }

      /* 「지금 여는지 확인 중…」 자리를 채운다.
       *
       * 체인에는 안 바뀌는 것만 적혀 있어서, 주문 주소가 비어 있는 가게가
       * 정상이다. 지금 어디서 받는지는 그 가게의 열쇠가 서명한 최신 공지에
       * 있고, 그건 **이 브라우저가 직접** 릴레이에 물어 직접 서명을 확인한다.
       * 우리 서버가 대신 읽어 주면 우리가 가짜 주소를 끼워 넣을 자리가 생긴다.
       *
       * 🔴 주소를 받았다고 바로 버튼을 그리지 않는다. 옛 주소를 눌러 404 를
       * 보는 것은 손님에게 「가게가 없다」로 읽힌다. 그 주소를 직접 찔러
       * 보고 싶지만 그럴 수가 없다 — 이 화면의 CSP 는 `connect-src 'self'` 라
       * 바깥 주소로 못 나가고, 가게 노드도 CORS 를 안 열어 둔다. 뚫으면
       * 남이 넣은 가게 이름이 아무 데나 연결할 수 있는 문이 된다.
       *
       * 그래서 찔러 보는 대신 **공지의 나이를 본다.** 아래에 적어 뒀다.
       */
      // 찾기 칸에 글자를 칠 때마다 목록을 다시 그린다. 그때마다 릴레이에 다시
      // 물으면 한 글자에 세 곳씩 두드리는 셈이고, 릴레이가 우리를 차단한다.
      const LIVE_CACHE = {};

      async function fillLive() {
        const ask = window.rvnLiveShopAddress;
        const spots = [...document.querySelectorAll("[data-live]")];
        if (!ask) { spots.forEach((el) => el.remove()); return; }
        for (const el of spots) {
          const key = el.dataset.live;
          let live = LIVE_CACHE[key];
          if (live === undefined) {
            try {
              live = await ask(key, el.dataset.pk);
            } catch { live = null; }
            // 🔴 **공지의 나이를 본다.** 가게 노드는 문이 열려 있는 동안
            // 45분마다 같은 공지를 다시 올린다. 그러니 두 시간이 넘은 공지는
            // 「그 컴퓨터가 그냥 죽었다」는 뜻이다 — 닫는다는 인사도 못 하고
            // 꺼진 경우다.
            //
            // 공지에 만료 시각을 달아 두긴 했지만(NIP-40), 릴레이가 그걸
            // 지킬 의무는 없다. 지키는 곳도 있고 무시하는 곳도 있어서,
            // 릴레이를 믿는 대신 **여기서 다시 센다.**
            if (live && Date.now() / 1000 - live.at > 2 * 3600) live = null;
            LIVE_CACHE[key] = live;
          }
          if (!live) { el.remove(); continue; }   // 닫혀 있으면 자리를 없앤다

          /* 🔴 **바뀌는 것들을 여기서 덮어쓴다.** 체인에는 안 바뀌는 것만
             있어서(이름·공개키·돈 받을 주소), 사진·전화·위치는 대개 비어
             있다. 가게가 그걸 고칠 때마다 재발행(100 RVN)을 물릴 수는 없다.

             체인 값이 있으면 체인이 이긴다 — 자산 이름은 아무도 못 고치는
             사실이고, 이 글은 가게가 아무 때나 다시 쓰는 것이다. */
          const p = live.profile || {};
          const card = el.closest(".card");
          if (card) {
            const nm = card.querySelector(".nm");
            if (nm && p.name && nm.textContent === el.dataset.live.replace(/^SHOP\./, ""))
              nm.textContent = p.name;
            const de = card.querySelector(".de");
            if (de && (p.description || p.location))
              de.textContent = p.description || p.location;
            // 사진. IPFS 주소이거나 https 주소다 — 어느 쪽이든 **주소**지
            // 사진 자체가 아니다. 그래서 바꿔도 소각이 0원이다.
            const img = card.querySelector("img");
            const icon = typeof p.icon === "string" ? p.icon : "";
            if (img && icon) {
              const src = /^https:\/\//i.test(icon)
                ? icon
                // 폴더 주소 뒤에 파일 이름이 붙는다 — `Qm…/icon.jpg`.
                // 이름 없이 폴더만 쓰면 그림 대신 목록이 온다.
                : /^Qm[1-9A-HJ-NP-Za-km-z]{44}(\/[\w.-]{1,40})?$/.test(icon)
                  ? `/rvn/api/ipfs/${icon}`
                  : "";
              if (src) img.src = src;
            }
          }

          // 문은 닫혔는데 프로필만 온 경우. 정보는 갱신하고 버튼은 안 그린다.
          if (!live.url) { el.remove(); continue; }

          const a = document.createElement("a");
          a.className = "orderbtn";
          a.href = safeUrl(live.url) || "#";
          a.target = "_blank";
          a.rel = "noopener noreferrer";
          a.textContent = "지금 문 열었습니다 · 주문하러 가기";
          el.replaceWith(a);
        }
      }

      // 길찾기. 우리는 지도를 그리지 않고, 손님이 이미 쓰는 앱으로 넘긴다.
      //
      // geo: 만 쓰면 한국 폰에서 아무 일도 안 일어난다 — 구글 지도가 없는 폰이
      // 많다. 그래서 한 번 고르게 하고 그 선택을 기억한다.
      const MAPKEY = "playx-map-app";

      // 가게 카드를 누르면 자세히 열린다. 위임으로 건다 — 목록은 찾을
      // 때마다 다시 그려지고, 그때마다 새로 묶으면 반드시 빠뜨린다.
      //
      // 🔴 길찾기(`data-go`)를 카드보다 **먼저** 본다. 단추가 카드 안에
      //    있어서, 카드를 먼저 받으면 가게 시트만 열리고 길찾기는
      //    시트 뒤에서 돌아간다 — 눌러도 아무 일이 없는 것처럼 보였다.
      document.addEventListener("click", (e) => {
        if (e.target.closest?.("#sh-close")) {
          $("shopwrap")?.classList.remove("on");
          return;
        }
        const go = e.target.closest?.("[data-go]");
        if (go) {
          e.preventDefault();
          e.stopPropagation();
          const [lat, lon] = go.dataset.go.split(",").map(Number);
          openDirections(lat, lon, go.dataset.nm || "");
          return;
        }
        const card = e.target.closest?.("[data-open]");
        if (card) {
          e.preventDefault();
          openShop(card.dataset.open);
        }
      });
      // 바깥을 눌러도 닫힌다. 어르신은 「닫기」를 못 찾고 뒤로가기를 누른다.
      document.addEventListener("click", (e) => {
        if (e.target.id === "shopwrap") $("shopwrap").classList.remove("on");
      });

      function directionApps(lat, lon, name) {
        const n = encodeURIComponent(name || "가게");
        return [
          { id: "kakao", name: "카카오맵", note: "길 안내가 가장 정확합니다",
            app: `kakaomap://route?ep=${lat},${lon}&by=CAR`,
            web: `https://map.kakao.com/link/to/${n},${lat},${lon}` },
          { id: "naver", name: "네이버지도", note: "",
            app: `nmap://route/car?dlat=${lat}&dlng=${lon}&dname=${n}&appname=se.erci.rvn`,
            web: `https://map.naver.com/p/directions/-/${lon},${lat},${n}/-/car` },
          { id: "tmap", name: "티맵", note: "",
            app: `tmap://route?goalx=${lon}&goaly=${lat}&goalname=${n}`,
            web: `https://tmap.life/route?goalx=${lon}&goaly=${lat}` },
          { id: "apple", name: "애플 지도", note: "아이폰에 기본으로 있습니다",
            app: `maps://?daddr=${lat},${lon}&dirflg=d`,
            web: `https://maps.apple.com/?daddr=${lat},${lon}&dirflg=d` },
          { id: "google", name: "구글 지도", note: "한국에서는 길 안내가 제한됩니다",
            app: `comgooglemaps://?daddr=${lat},${lon}&directionsmode=driving`,
            web: `https://www.google.com/maps/dir/?api=1&destination=${lat},${lon}` },
        ];
      }

      async function openDirections(lat, lon, name) {
        if (!Number.isFinite(lat) || !Number.isFinite(lon)) return;
        let apps = directionApps(lat, lon, name);
        try {
          const j = await fetch(
            `/api/directions?lat=${lat}&lon=${lon}&label=${encodeURIComponent(name)}`
          ).then((r) => r.json());
          if (Array.isArray(j) && j.length) apps = j;
        } catch { /* 아래 목록으로 안내한다 */ }
        if (!Array.isArray(apps) || !apps.length) return;

        const saved = localStorage.getItem(MAPKEY);
        const pick = saved && apps.find((a) => a.id === saved);
        if (pick) return launch(pick);

        // 처음 한 번만 묻는다. 매번 물으면 그 자체가 방해가 된다.
        const sheet = $("mapsheet");
        if (!sheet) return;
        sheet.innerHTML =
          `<div class="msbox">
             <div class="mshead">어느 지도로 안내할까요</div>
             ${apps
               .map(
                 (a) => `<button class="msbtn" data-map="${a.id}">
                   ${a.name}${a.note ? `<span>${a.note}</span>` : ""}
                 </button>`
               )
               .join("")}
             <label class="mschk"><input type="checkbox" id="msremember" checked />
               <span>다음부터 이 앱으로</span></label>
             <button class="msbtn cancel" id="mscancel">취소</button>
           </div>`;
        sheet.classList.add("on");

        sheet.querySelectorAll("[data-map]").forEach((btn) => {
          btn.onclick = () => {
            const a = apps.find((x) => x.id === btn.dataset.map);
            if ($("msremember").checked) localStorage.setItem(MAPKEY, a.id);
            sheet.classList.remove("on");
            launch(a);
          };
        });
        $("mscancel").onclick = () => sheet.classList.remove("on");
      }

      function launch(a) {
        // 앱 스킴을 먼저 던지고, 아무 일도 안 일어나면 웹으로 넘어간다.
        // 앱이 열렸으면 이 탭은 백그라운드로 가서 타이머가 늦게 돌거나 안 돈다.
        const t = Date.now();
        location.href = a.app;
        setTimeout(() => {
          if (document.hidden || Date.now() - t > 1600) return;
          location.href = a.web;
        }, 900);
      }

      $("q").oninput = render;
      load();
    </script>
      <!-- 🔴 `defer` 가 꼭 있어야 한다. 이 스크립트는 617줄에 있고 라비 단추는
         620줄에 있다 — 스크립트가 먼저 돌면 그 단추가 아직 없어서
         `getElementById("ravi-ask")` 가 null 이고, `wireRaviAsk` 가 조용히
         빠져나간다. 그래서 **단추는 보이는데 눌러도 아무 일이 없었다.**
         (같은 파일의 탭 단추는 320줄이라 멀쩡히 붙는다 — 그래서 더 안 보였다)
         defer 는 문서를 다 읽은 뒤에 돌린다. -->
    <!-- 가게 자세히. 아래에서 올라오는 시트 — 목록을 잃지 않고 돌아온다. -->
    <div class="shopwrap" id="shopwrap">
      <div class="shopsheet">
        <div class="shoptitle" id="sh-name"></div>
        <div class="shopsub" id="sh-sub"></div>
        <div id="sh-rows"></div>
        <div id="sh-acts"></div>
        <button class="shopno" id="sh-close">닫기</button>
      </div>
    </div>
    <div id="mapsheet"></div>

    <script defer src="/shops.bundle.js"></script>
      <!-- 손님도 물어볼 수 있어야 한다. 여기 있는 사람은 사장이 아니라
         손님이라 **가게 정보만** 답하는 쪽을 쓴다. -->
    <button class="raviask" id="ravi-ask">
      <img src="/raven-head.webp" alt="" />
      <span>Ravi에게 물어보기</span>
    </button>

    <nav class="tabbar">
      <a href="/wallet" class="tab">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18"/><circle cx="17" cy="14" r="1.3"/></svg>
        <span>지갑</span>
      </a>
      <a href="/shops" class="tab on" aria-current="page">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9l1.5-4h13L20 9"/><path d="M4 9h16v10H4z"/><path d="M9 19v-6h6v6"/></svg>
        <span>가게</span>
      </a>
      <a href="/shops#items" class="tab">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 7h12l1 12H5z"/><path d="M9 7a3 3 0 016 0"/></svg>
        <span>물건</span>
      </a>
    </nav>
    <script>
      // 손님 폰이 정한 말로 화면을 바꾼다. 없는 문장은 한국어
      // 그대로 둔다 — 빈 자리보다 낫다.
      window.translateDom && translateDom(document.body);
    </script>

    <script>
      /* 라비는 **가게 컴퓨터의 열쇠**로 깨어난다. 이 폰에는 키를 넣지 않는다.
         (why: ravi.js 첫 주석) */
      (async () => {
        const st = await window.Ravi.status();
        document.querySelectorAll("[data-ravi]").forEach((el) => {
          if (st.awake) return;                 // 깨어 있으면 원래대로 둔다
          el.hidden = true;             // 손님에게는 없는 기능이다
        });
      })();
    </script>
</body>
</html>
