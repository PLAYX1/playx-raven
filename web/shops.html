<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>가게 찾기</title>
    <style>
      :root {
        --bg: #ffffff; --fg: #141518; --muted: #6b7280; --line: #e6e7ea;
        --panel: #fafafb; --accent: #3b3f8f; --warn: #b45309;
        --safe-b: env(safe-area-inset-bottom, 0px);
      }
      @media (prefers-color-scheme: dark) {
        :root { --bg: #101114; --fg: #eceef2; --muted: #9aa0ab; --line: #26282e;
                --panel: #17191d; --accent: #8d92e8; --warn: #d99b3f; }
      }
      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      body { margin: 0; background: var(--bg); color: var(--fg);
             font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", system-ui, sans-serif;
             padding: 20px 18px calc(24px + var(--safe-b)); }
      h1 { margin: 0 0 3px; font-size: 21px; letter-spacing: -0.02em; }
      .sub { color: var(--muted); font-size: 12.5px; }
      .search { margin: 16px 0 14px; }
      .search input { width: 100%; padding: 13px 14px; border-radius: 11px;
                      border: 1px solid var(--line); background: var(--panel); color: var(--fg);
                      font-size: 15px; font-family: inherit; }

      .card { display: flex; gap: 13px; align-items: center; padding: 14px 0;
              border-bottom: 1px solid var(--line); text-decoration: none; color: inherit; }
      .card img { width: 56px; height: 56px; object-fit: cover; border-radius: 11px;
                  flex: none; background: var(--panel); }
      .card .ph { width: 56px; height: 56px; border-radius: 11px; flex: none;
                  background: var(--panel); }
      .card .nm { font-weight: 600; font-size: 15px; }
      .card .de { color: var(--muted); font-size: 12.5px; margin-top: 1px;
                  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .tags { display: flex; gap: 5px; margin-top: 5px; }
      .tag { font-size: 10.5px; padding: 2px 7px; border-radius: 999px;
             border: 1px solid var(--line); color: var(--muted); }
      .empty { color: var(--muted); padding: 40px 0; text-align: center; font-size: 14px;
               line-height: 1.8; }
      /* 지도 앱 고르기. 한 번 고르면 기억한다. */
      #mapsheet { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: none;
                  align-items: flex-end; justify-content: center; z-index: 50; }
      #mapsheet.on { display: flex; }
      .msbox { background: var(--bg); border-radius: 18px 18px 0 0; width: 100%;
               max-width: 480px; padding: 20px 18px calc(20px + var(--safe-b)); }
      .mshead { font-size: 17px; font-weight: 600; margin-bottom: 14px; }
      .msbtn { display: block; width: 100%; min-height: 56px; margin-bottom: 9px;
               border-radius: 12px; border: 1px solid var(--line); background: var(--panel);
               color: var(--fg); font-size: 17px; font-family: inherit; cursor: pointer; }
      .msbtn span { display: block; font-size: 13px; color: var(--muted); margin-top: 2px; }
      .msbtn.cancel { background: transparent; border-color: transparent; color: var(--muted);
                      font-size: 15px; min-height: 48px; }
      .mschk { display: flex; align-items: center; gap: 10px; padding: 12px 4px;
               font-size: 15px; }
      .mschk input { width: 22px; height: 22px; }
      .foot { margin-top: 22px; font-size: 11.5px; color: var(--muted); line-height: 1.8; }
          /* 목록에서 가장 큰 동작. 가게를 찾은 다음에 할 일은 주문뿐이다. */
      .orderbtn { display: inline-block; margin-top: 8px; margin-right: 8px;
                  padding: 9px 16px; border-radius: 8px; background: var(--fg);
                  color: var(--bg); font-size: 13px; font-weight: 600;
                  text-decoration: none; }
</style>
  </head>
  <body>
    <!-- 들어올 문만 만들고 나갈 문을 안 만들었다. 폰에 뒤로가기가 있지만,
         지갑에서 링크로 온 사람은 그걸 누를 생각을 안 한다. -->
    <a class="back" href="/wallet">← 내 지갑</a>
    <h1 id="pagetitle">가게 찾기</h1>

    <!-- 가게는 체인에, 물건은 릴레이에 있다. 손님에게는 둘 다 "여기서 살 수
         있는 것" 이라 나누는 것은 우리 사정이지 손님 사정이 아니다. -->
    <div class="tabs" style="display:flex;gap:8px;margin:0 0 14px">
      <button class="tb on" data-tab="shops">가게</button>
      <button class="tb" data-tab="items">물건</button>
    </div>
    <div class="sub" id="count">불러오는 중…</div>

    <div class="search"><input id="q" placeholder="가게 이름" autocomplete="off" /></div>
    <div class="row" style="display:flex;gap:8px;margin-bottom:12px">
      <button id="near" style="flex:1;padding:12px;border-radius:10px;border:1px solid var(--line);
              background:var(--panel);color:var(--fg);font-size:14px;font-family:inherit">
        가까운 순으로
      </button>
    </div>
    <div class="sub" id="locnote" style="margin-bottom:10px"></div>
    <div id="list"><div class="empty">체인에서 읽는 중…</div></div>
    <div id="items" style="display:none"><div class="empty">불러오는 중…</div></div>
    <div id="mapsheet"></div>
    <div id="sheet" style="display:none"></div>

    <p class="foot">
      이 목록은 서버가 아니라 <b>블록체인에서 직접</b> 읽습니다. 이 가게의 컴퓨터가 대신 읽어 보여줄 뿐이고,
      어느 회사도 목록을 가지고 있지 않습니다.<br />
      가게 정보는 각 가게가 스스로 올린 것입니다. 아무도 검사하지 않으니
      <b>처음 보는 가게에 큰 돈을 보내기 전에 확인하세요.</b>
    </p>

    <script>
      const $ = (id) => document.getElementById(id);

      // 🔴 이 목록의 글자는 **남이 체인에 올린 것**이다. 아무나 SHOP.무엇을
      // 발행할 수 있고(500 RVN), 그 이름·설명이 여기 그려진다. 그대로 넣으면
      // 남이 넣은 <script> 가 이 목록을 여는 **모든 손님의 브라우저에서**
      // 돈다 — 지갑을 열어 둔 손님이면 12단어가 위험하다.
      //
      // 탈중앙이라 등록을 막을 수 없다. 막을 수 있는 것은 **그리는 방식**뿐이다.
      // 주소도 남이 정한다. javascript: 같은 것이 들어오면 그건 우리가
      // 뿌리는 공격이 된다. http/https 만 통과시킨다.
      const safeUrl = (u) => (/^https?:\/\//i.test(String(u || "")) ? String(u) : "");
      const esc = (v) => String(v ?? "")
        .replace(/&/g, "&amp;").replace(/</g, "&lt;")
        .replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
      let all = [], me = null;

      // 직선거리. 걸어가는 거리가 아니다 — 강 건너 200m 는 20분이고, 그걸
      // 숨긴 숫자는 없는 숫자보다 나쁘다. 그래서 화면에도 "직선"이라 쓴다.
      function haversine(a, b) {
        const R = 6371000, rad = (d) => (d * Math.PI) / 180;
        const dp = rad(b.lat - a.lat), dl = rad(b.lon - a.lon);
        const x =
          Math.sin(dp / 2) ** 2 +
          Math.cos(rad(a.lat)) * Math.cos(rad(b.lat)) * Math.sin(dl / 2) ** 2;
        return 2 * R * Math.asin(Math.sqrt(x));
      }

      const fmtDist = (m) =>
        m < 1000 ? `직선 ${Math.round(m / 10) * 10}m` : `직선 ${(m / 1000).toFixed(1)}km`;

      $("near").onclick = () => {
        if (!navigator.geolocation) {
          $("locnote").textContent = "이 브라우저는 위치를 지원하지 않습니다.";
          return;
        }
        // http://192.168.x 에서는 브라우저가 위치를 안 준다. 가짜 좌표를 넣지
        // 않고, 왜 안 되는지 그대로 말한다.
        if (!window.isSecureContext) {
          $("locnote").innerHTML =
            "이 주소(<code>http</code>)에서는 브라우저가 위치를 주지 않습니다. " +
            "가게가 <b>바깥 주소</b>를 켜면 됩니다.";
          return;
        }
        $("locnote").textContent = "위치를 읽는 중…";
        navigator.geolocation.getCurrentPosition(
          (p) => {
            me = { lat: p.coords.latitude, lon: p.coords.longitude };
            all.forEach((s) => {
              if (s.profile?.lat != null) s.dist = haversine(me, s.profile);
            });
            $("locnote").textContent = "가까운 순으로 보여드립니다.";
            render();
          },
          () => { $("locnote").textContent = "위치를 받지 못했습니다."; },
          { timeout: 10000 }
        );
      };

      // 매장 노드 판과 다른 점은 여기 하나다. 이쪽은 프로필까지 **서버가 미리
      // 붙여** 평평한 한 덩어리로 준다 — 손님 폰이 가게 수만큼 IPFS 를 두드리면
      // 목록 하나 여는 데 몇 초가 걸리고, 지하철에서는 아예 안 열린다.
      //
      // 명부를 우리가 들고 있는 것은 아니다. 같은 질문을 다른 노드에 해도 같은
      // 답이 나오고, 우리가 문을 닫아도 가게는 체인에 남는다. 이 경로는 그 답을
      // 빠르게 전해 주는 통로지 명부 자체가 아니다.
      async function load() {
        try {
          const r = await fetch("/api/chain/shops", { cache: "no-store" }).then((x) => x.json());
          if (r.error) throw new Error(r.error);
          all = (r.shops || []).map((s) => ({
            asset: s.asset,
            profile: {
              name: s.title,
              desc: s.description,
              icon: s.icon,
              location: s.location,
              lat: s.lat,
              lon: s.lon,
              // 프로필을 못 읽은 가게도 목록에 남긴다. 조용히 빼면 가게가
              // 사라진 것처럼 보이고, 사장은 자기 가게가 왜 없는지 못 찾는다.
              offline: s.offline,
              menu_count: s.menu_count,
              order_url: s.order_url,
            },
          }));
          if (me) {
            for (const s of all) {
              if (s.profile.lat != null) s.dist = haversine(me, s.profile);
            }
          }
          $("count").textContent = `${all.length}곳`;
          render();
        } catch (e) {
          // "Unexpected token '<'" 를 그대로 보여 주지 않는다. 사람이 할 수
          // 있는 일이 하나도 없는 문장이다.
          $("list").innerHTML =
            `<div class="empty">가게 목록을 불러오지 못했습니다.<br />` +
            `잠시 뒤에 다시 열어 주세요.</div>`;
        }
      }

      function render() {
        const q = $("q").value.trim().toLowerCase();
        let rows = all.filter((s) => {
          if (!q) return true;
          const hay = `${s.asset} ${s.profile?.name || ""}`.toLowerCase();
          return hay.includes(q);
        });
        // 좌표가 없는 가게를 0m 로 두면 맨 위에 올라온다. 뒤로 보낸다.
        if (me) rows = rows.sort((a, b) => (a.dist ?? Infinity) - (b.dist ?? Infinity));

        $("list").innerHTML = rows.length
          ? rows
              .map((s) => {
                const p = s.profile || {};
                const label = s.asset.replace(/^SHOP\./, "");
                return `<a class="card" href="#">
                  ${safeUrl(p.icon) ? `<img src="${esc(safeUrl(p.icon))}" alt="" loading="lazy" />` : `<div class="ph"></div>`}
                  <div style="min-width:0">
                    <div class="nm">${esc(p.name || label)}</div>
                    <div class="de">${esc(p.desc || p.location || label)}</div>
                    <div class="tags">
                      ${s.dist != null ? `<span class="tag">${fmtDist(s.dist)}</span>` : ""}
                      ${p.menu_count ? `<span class="tag">메뉴 ${p.menu_count}가지</span>` : ""}
                      ${
                        // 이름은 아무나 1,700원이면 선점한다. 손님이 판단할
                        // 근거를 준다 — 순위만 바꾸고 이유를 감추면 우리가
                        // 대신 판단해 주는 것이고, 그럼 우리가 심사 기관이 된다.
                        p.offline
                          ? `<span class="tag warn">정보를 못 읽었습니다</span>`
                          : (!p.desc && p.lat == null && !p.menu_count
                              ? `<span class="tag warn">이름만 등록됨</span>`
                              : "")
                      }
                    </div>
                    ${
                      p.order_url
                        ? `<a class="orderbtn" href="${esc(safeUrl(p.order_url))}" target="_blank" rel="noopener noreferrer">주문하러 가기</a>`
                        : ""
                    }
                    ${
                      p.lat != null
                        ? `<button data-go="${p.lat},${p.lon}" data-nm="${esc(p.name || "")}"
                             style="margin-top:8px;padding:8px 14px;border-radius:8px;
                             border:1px solid var(--line);background:var(--bg);color:var(--fg);
                             font-size:13px;font-family:inherit">길찾기</button>`
                        : ""
                    }
                  </div>
                </a>`;
              })
              .join("")
          : `<div class="empty">${
              all.length
                ? "찾는 가게가 없습니다."
                : `<img src="/raven-head.webp" alt="" width="150" style="display:block;margin:0 auto 12px;border-radius:14px" />
                   아직 등록된 가게가 없습니다.<br>첫 번째 가게가 되실 수 있습니다.`
            }</div>`;
      }

      // 길찾기. 우리는 지도를 그리지 않고, 손님이 이미 쓰는 앱으로 넘긴다.
      //
      // geo: 만 쓰면 한국 폰에서 아무 일도 안 일어난다 — 구글 지도가 없는 폰이
      // 많다. 그래서 한 번 고르게 하고 그 선택을 기억한다.
      const MAPKEY = "playx-map-app";

      document.addEventListener("click", (e) => {
        const b = e.target.closest?.("[data-go]");
        if (!b) return;
        e.preventDefault();
        const [lat, lon] = b.dataset.go.split(",").map(Number);
        openDirections(lat, lon, b.dataset.nm || "");
      });

      async function openDirections(lat, lon, name) {
        const apps = await fetch(
          `/api/directions?lat=${lat}&lon=${lon}&label=${encodeURIComponent(name)}`
        ).then((r) => r.json()).catch(() => null);
        if (!apps) return;

        const saved = localStorage.getItem(MAPKEY);
        const pick = saved && apps.find((a) => a.id === saved);
        if (pick) return launch(pick);

        // 처음 한 번만 묻는다. 매번 물으면 그 자체가 방해가 된다.
        $("mapsheet").innerHTML =
          `<div class="msbox">
             <div class="mshead">어느 지도로 안내할까요</div>
             ${apps
               .map(
                 (a) => `<button class="msbtn" data-map="${a.id}">
                   ${a.name}${a.note ? `<span>${a.note}</span>` : ""}
                 </button>`
               )
               .join("")}
             <label class="mschk"><input type="checkbox" id="msremember" checked />
               <span>다음부터 이 앱으로</span></label>
             <button class="msbtn cancel" id="mscancel">취소</button>
           </div>`;
        $("mapsheet").classList.add("on");

        $("mapsheet").querySelectorAll("[data-map]").forEach((btn) => {
          btn.onclick = () => {
            const a = apps.find((x) => x.id === btn.dataset.map);
            if ($("msremember").checked) localStorage.setItem(MAPKEY, a.id);
            $("mapsheet").classList.remove("on");
            launch(a);
          };
        });
        $("mscancel").onclick = () => $("mapsheet").classList.remove("on");
      }

      function launch(a) {
        // 앱 스킴을 먼저 던지고, 아무 일도 안 일어나면 웹으로 넘어간다.
        // 앱이 열렸으면 이 탭은 백그라운드로 가서 타이머가 늦게 돌거나 안 돈다.
        const t = Date.now();
        location.href = a.app;
        setTimeout(() => {
          if (document.hidden || Date.now() - t > 1600) return;
          location.href = a.web;
        }, 900);
      }

      $("q").oninput = render;
      load();
    </script>
      <script src="/shops.bundle.js"></script>
  </body>
</html>
