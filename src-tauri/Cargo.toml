[package]
name = "playx-raven"
version = "0.1.0"
description = "레이븐 노드 · IPFS · 채굴 · 자판기 · 가게 계산대를 한 프로그램으로"
authors = ["PLAY X"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "playx_raven_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Hands local gateway URLs to the OS viewer instead of rendering arbitrary
# documents inside a wallet-adjacent window.
open = "5"
# JSON-RPC to ravend and HTTP API to the IPFS daemon. rustls rather than the
# system TLS stack: both endpoints are on localhost, and this avoids dragging in
# OpenSSL just to talk to 127.0.0.1.
zip = { version = "2", default-features = false, features = ["deflate"] }
sha2 = "0.10"
hex = "0.4"
# 릴레이에 글을 올릴 때. 🔴 지갑 화면은 connect-src 'self' 라 밖으로 못 나간다 —
# 12단어가 있는 페이지에 바깥 통로를 내지 않기 위해서다. 노드가 대신 나간다.
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart"] }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
# 파일 고르기는 OS 가 해야 한다. 경로를 타이핑하게 하면 아무도 안 한다.
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Serves the phone screens — the owner's remote control and the customer's
# order page — from this machine over the local network. Tauri already pulls in
# tokio, so this adds a router and nothing heavier.
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros"] }
# The owner scans this to reach their own node without typing an IP.
qrcode = { version = "0.14", default-features = false, features = ["svg"] }

