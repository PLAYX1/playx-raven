[package]
name = "playx-raven"
# 🔴 **이 값이 문제 신고에 실린다.** `report.rs` 가
# `env!("CARGO_PKG_VERSION")` 으로 읽어 「PLAY X Raven <판>」을 적는데,
# 여기가 처음 만든 뒤로 `0.1.0` 그대로였다. 그래서 사장님이 신고를 보내도
# **어느 판에서 난 일인지 알 수가 없었다** — 신고의 값어치가 절반이 된다.
# 판을 올릴 때 `tauri.conf.json` 과 **같이** 올린다.
version = "0.1.94"
description = "레이븐 노드 · IPFS · 채굴 · 자판기 · 가게 계산대를 한 프로그램으로"
authors = ["PLAY X"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "playx_raven_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Hands local gateway URLs to the OS viewer instead of rendering arbitrary
# documents inside a wallet-adjacent window.
open = "5"
# JSON-RPC to ravend and HTTP API to the IPFS daemon. rustls rather than the
# system TLS stack: both endpoints are on localhost, and this avoids dragging in
# OpenSSL just to talk to 127.0.0.1.
zip = { version = "2", default-features = false, features = ["deflate"] }
sha2 = "0.10"
# 클라우드로 나가는 백업을 우리가 한 번 더 잠근다.
# 🔴 레이븐코인 지갑 암호는 2011년 방식(SHA-512 25,000회)이라 GPU 로 초당
#    8만 개를 시험할 수 있다. 영단어 하나짜리 암호는 2.5초에 뚫린다.
#    Argon2id 는 메모리를 많이 쓰게 만들어 GPU 의 이점을 없앤다.
aes-gcm = "0.10"
argon2 = "0.5"
rand = "0.8"
hex = "0.4"
# 릴레이에 글을 올릴 때. 🔴 지갑 화면은 connect-src 'self' 라 밖으로 못 나간다 —
# 12단어가 있는 페이지에 바깥 통로를 내지 않기 위해서다. 노드가 대신 나간다.
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
# 가게 주소를 노드가 **스스로** 공지하려면 서명할 열쇠가 있어야 한다.
# 🔴 지갑의 12단어에서 뽑지 않는다 — 그 열쇠는 브라우저 안에서만 살아야 하고,
#    노드로 내려오는 순간 가게 돈과 가게 간판이 같은 열쇠를 쓰게 된다.
secp256k1 = { version = "0.30", features = ["rand", "std"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart"] }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
# 파일 고르기는 OS 가 해야 한다. 경로를 타이핑하게 하면 아무도 안 한다.
tauri-plugin-dialog = "2"
# 자동 업데이트. 🔴 받아만 두고 **사장이 눌러야** 설치된다 — 장사 중에
# 저절로 재시작되면 손님 폰 서버가 끊기고 QR 이 먹통이 된다.
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
# 🔴 `preserve_order` 가 반드시 필요하다.
# 기본 serde_json 은 객체 키를 **알파벳순으로 정렬**한다. 그런데 레이븐
# 노드의 `createrawtransaction` 은 출력 객체의 **적은 순서대로** 출력을
# 만든다. 원자 교환의 서명(SIGHASH_SINGLE)은 「0번 입력 ↔ 0번 출력」을
# 묶는 것이라, 순서가 뒤집히면 파는 사람의 서명이 **엉뚱한 출력**에 붙는다.
# 조용히 돈이 새는 자리다. (swap.rs 에서 조립 뒤에 한 번 더 확인한다.)
serde_json = { version = "1", features = ["preserve_order"] }
# Serves the phone screens — the owner's remote control and the customer's
# order page — from this machine over the local network. Tauri already pulls in
# tokio, so this adds a router and nothing heavier.
# 🔴 `ws` 를 켠다. 이 프로그램이 **릴레이 노릇**을 하려면 웹소켓을 받아야
# 한다 — 지금은 남의 릴레이 세 곳에 올리기만 한다.
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros"] }
# The owner scans this to reach their own node without typing an IP.
qrcode = { version = "0.14", default-features = false, features = ["svg"] }

